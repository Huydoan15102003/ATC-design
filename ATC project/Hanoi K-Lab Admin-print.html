<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hanoi K-Lab — User Management</title>
<meta name="viewport" content="width=1440, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary:        #1352CC;
    --primary-hover:  #0F42A8;
    --primary-light:  #EEF3FF;
    --primary-border: #C7D9FF;
    --ink:    #111827;
    --ink-2:  #374151;
    --muted:  #6B7280;
    --muted-2:#9CA3AF;
    --hair:   #E5E7EB;
    --hair-2: #F3F4F6;
    --canvas: #F9FAFB;
    --white:  #FFFFFF;
    --success:#16A34A; --success-tint:#F0FDF4; --success-border:#BBF7D0;
    --amber:  #D97706; --amber-tint: #FFFBEB;  --amber-border: #FDE68A;
    --danger: #DC2626; --danger-tint: #FEF2F2; --danger-border:#FECACA;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 1px 3px rgba(0,0,0,0.06), 0 4px 8px rgba(0,0,0,0.04);
    --shadow-lg: 0 2px 6px rgba(0,0,0,0.05), 0 12px 28px rgba(0,0,0,0.09);
    --shadow-drawer: -2px 0 16px rgba(0,0,0,0.07), -1px 0 4px rgba(0,0,0,0.04);
    --focus-ring: 0 0 0 3px rgba(19,82,204,0.18);
    --sidebar-w: 220px;
    --topbar-h: 56px;
    --drawer-w: 360px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5;
    color: var(--ink);
    background: var(--canvas);
    -webkit-font-smoothing: antialiased;
  }

  /* ── LAYOUT ── */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--white); border-right: 1px solid var(--hair);
    display: flex; flex-direction: column;
    padding: 18px 0 18px;
    position: sticky; top: 0; height: 100vh; overflow: hidden; z-index: 2;
  }
  .sb-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 16px 18px;
    border-bottom: 1px solid var(--hair);
    margin-bottom: 8px;
  }
  .sb-logo .mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--primary); color: #fff;
    display: grid; place-items: center;
    font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  .sb-logo .name  { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.2; }
  .sb-logo .org   { font-size: 11px; color: var(--muted-2); margin-top: 1px; }

  .sb-section {
    font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted-2);
    padding: 10px 16px 5px;
  }
  .sb-nav { display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
  .sb-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px;
    border-radius: 6px; border-left: 2.5px solid transparent;
    color: var(--ink-2); font-size: 13.5px; font-weight: 400;
    cursor: default; text-decoration: none;
    transition: background .12s, color .12s;
  }
  .sb-item:hover { background: var(--hair-2); }
  .sb-item.active {
    border-left-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary); font-weight: 500;
    border-radius: 0 6px 6px 0;
    margin-left: -8px; padding-left: 15.5px;
  }
  .sb-item .ico { color: var(--muted-2); display: grid; place-items: center; flex-shrink: 0; }
  .sb-item.active .ico { color: var(--primary); }
  .sb-count {
    margin-left: auto; font-size: 11.5px; font-weight: 500;
    background: var(--hair-2); color: var(--muted-2);
    padding: 1px 7px; border-radius: 999px; border: 1px solid var(--hair);
  }
  .sb-item.active .sb-count { background: #fff; color: var(--primary); border-color: var(--primary-border); }

  .sb-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--hair); }
  .sb-user {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: 6px; cursor: default;
  }
  .sb-user:hover { background: var(--hair-2); }
  .sb-user .av {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg,#1352CC,#5B87F0);
    color: #fff; font-size: 12px; font-weight: 500;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .sb-user .name { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.2; }
  .sb-user .role { font-size: 11.5px; color: var(--muted-2); }
  .sb-user .chev { margin-left: auto; color: var(--muted-2); }

  /* ── MAIN ── */
  .main { display: flex; flex-direction: column; min-width: 0; }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--white); border-bottom: 1px solid var(--hair);
    height: var(--topbar-h);
    display: flex; align-items: center; padding: 0 28px; gap: 12px;
    position: sticky; top: 0; z-index: 5;
  }
  .breadcrumb { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .breadcrumb .sep { color: var(--hair); }
  .breadcrumb .now { color: var(--ink); font-weight: 500; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .top-icon-btn {
    appearance: none; border: 1px solid var(--hair); background: var(--white);
    width: 34px; height: 34px; border-radius: 6px;
    color: var(--muted); display: grid; place-items: center; cursor: default;
  }
  .top-icon-btn:hover { background: var(--hair-2); color: var(--ink-2); }

  /* ── PAGE ── */
  .page { padding: 26px 28px 80px; max-width: 1360px; margin: 0 auto; width: 100%; }

  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--hair);
  }
  .page-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 5px; color: var(--ink); }
  .page-head .meta { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 0; }
  .page-head .meta .dot { margin: 0 8px; color: var(--hair); }
  .page-head .meta b { color: var(--ink-2); font-weight: 500; }

  /* ── TABS ── */
  .tabs-strip {
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--hair);
    margin-bottom: 16px;
    position: sticky; top: var(--topbar-h); background: var(--canvas); z-index: 4;
  }
  .tab {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 13.5px; font-weight: 400; color: var(--muted);
    padding: 14px 0 13px; margin-right: 24px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    cursor: default; display: inline-flex; align-items: center; gap: 8px;
    transition: color .14s, border-color .14s;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
  .tab .cnt {
    font-size: 11px; font-weight: 500;
    padding: 1px 7px; border-radius: 999px;
    background: var(--hair-2); color: var(--muted); border: 1px solid var(--hair);
  }
  .tab.on .cnt { background: var(--primary-light); color: var(--primary); border-color: var(--primary-border); }

  /* ── TOOLBAR ── */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .search-wrap { position: relative; flex: 0 0 280px; }
  .search-wrap .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted-2); pointer-events: none; }
  .search-wrap input {
    width: 100%; height: 34px; padding: 0 12px 0 34px;
    border-radius: 6px; border: 1px solid var(--hair);
    background: var(--white); font: inherit; font-size: 13px;
    color: var(--ink); outline: none;
    transition: border-color .14s, box-shadow .14s;
  }
  .search-wrap input:focus { border-color: var(--primary); box-shadow: var(--focus-ring); }
  .search-wrap input::placeholder { color: var(--muted-2); }
  .chip-btn {
    height: 34px; padding: 0 11px; border: 1px solid var(--hair);
    border-radius: 6px; background: var(--white);
    color: var(--ink-2); font: inherit; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px; cursor: default;
  }
  .chip-btn:hover { background: var(--hair-2); }
  .chip-btn .val { color: var(--muted); }
  .chip-btn.active { background: var(--primary-light); border-color: var(--primary-border); color: var(--primary); }
  .spacer { flex: 1; }

  /* ── BUTTONS ── */
  .btn {
    appearance: none; border: 0; cursor: default;
    height: 34px; padding: 0 14px; border-radius: 6px;
    font: inherit; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .13s, border-color .13s; white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline { background: var(--white); border: 1px solid var(--hair); color: var(--ink-2); }
  .btn-outline:hover { background: var(--hair-2); border-color: #D1D5DB; }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--hair-2); color: var(--ink-2); }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 5px; }

  /* ── TABLE ── */
  .data-card {
    background: var(--white); border: 1px solid var(--hair);
    border-radius: 8px; box-shadow: var(--shadow-sm); overflow: hidden;
  }
  table.data { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.data thead th {
    text-align: left; font-size: 11.5px; font-weight: 500;
    color: var(--muted); padding: 9px 14px;
    border-bottom: 1px solid var(--hair); background: var(--hair-2);
    white-space: nowrap;
  }
  table.data tbody td {
    padding: 12px 14px; border-bottom: 1px solid var(--hair);
    font-size: 13.5px; color: var(--ink-2); vertical-align: middle;
  }
  table.data tbody tr:last-child td { border-bottom: 0; }
  table.data tbody tr { transition: background .1s; cursor: default; }
  table.data tbody tr:hover { background: var(--hair-2); }
  table.data tbody tr.selected { background: var(--primary-light); }

  /* student col widths */
  table.data.students col.c-name  { width: 21%; }
  table.data.students col.c-email { width: 22%; }
  table.data.students col.c-teach { width: 18%; }
  table.data.students col.c-level { width: 12%; }
  table.data.students col.c-sess  { width: 10%; }
  table.data.students col.c-score { width: 13%; }
  table.data.students col.c-acts  { width: 6%; }

  /* teacher col widths */
  table.data.teachers col.c-name  { width: 22%; }
  table.data.teachers col.c-email { width: 24%; }
  table.data.teachers col.c-stu   { width: 14%; }
  table.data.teachers col.c-sess  { width: 16%; }
  table.data.teachers col.c-score { width: 16%; }
  table.data.teachers col.c-acts  { width: 10%; }

  /* user cell */
  .ucell { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    color: #fff; font-size: 12px; font-weight: 500;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .avatar.lg { width: 52px; height: 52px; font-size: 17px; }
  .ucell .meta { min-width: 0; line-height: 1.2; }
  .ucell .uname { font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ucell .ucode { font-size: 11.5px; color: var(--muted-2); margin-top: 1px; }
  .email-cell { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* badges */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 500; border: 1px solid transparent; white-space: nowrap;
  }
  .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .badge.green { background: var(--success-tint); color: var(--success); border-color: var(--success-border); }
  .badge.amber { background: var(--amber-tint);   color: var(--amber);   border-color: var(--amber-border); }
  .badge.red   { background: var(--danger-tint);  color: var(--danger);  border-color: var(--danger-border); }
  .badge.blue  { background: var(--primary-light); color: var(--primary); border-color: var(--primary-border); }
  .badge.gray  { background: var(--hair-2); color: var(--muted); border-color: var(--hair); }

  /* score cell */
  .score-cell { display: flex; flex-direction: column; gap: 5px; }
  .score-row-in { display: flex; align-items: center; gap: 8px; }
  .score-val { font-size: 13.5px; font-weight: 500; color: var(--ink-2); min-width: 22px; }
  .mini-bar { flex: 1; height: 3px; border-radius: 999px; background: var(--hair); overflow: hidden; }
  .mini-bar .fill { height: 100%; border-radius: inherit; }
  .mini-bar .fill.green { background: var(--success); }
  .mini-bar .fill.amber { background: var(--amber); }
  .mini-bar .fill.red   { background: var(--danger); }

  /* row menu */
  .row-acts { position: relative; display: flex; justify-content: flex-end; }
  .icon-btn {
    appearance: none; border: 0; background: transparent;
    width: 28px; height: 28px; border-radius: 5px;
    color: var(--muted-2); display: grid; place-items: center; cursor: default;
  }
  .icon-btn:hover { background: var(--hair-2); color: var(--ink-2); }
  .icon-btn.on { background: var(--hair-2); color: var(--ink); }
  .menu {
    position: absolute; top: calc(100% + 4px); right: 0;
    min-width: 168px; background: var(--white);
    border: 1px solid var(--hair); border-radius: 8px;
    box-shadow: var(--shadow-lg); padding: 4px; z-index: 30;
    animation: menuIn .12s ease-out;
  }
  @keyframes menuIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
  .menu-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 7px 10px; border-radius: 5px;
    background: transparent; border: 0; appearance: none;
    font: inherit; font-size: 13px; color: var(--ink-2); text-align: left; cursor: default;
  }
  .menu-item:hover { background: var(--hair-2); }
  .menu-item .ico { color: var(--muted); }
  .menu-item.danger { color: var(--danger); }
  .menu-item.danger:hover { background: var(--danger-tint); }
  .menu-item.danger .ico { color: var(--danger); }
  .menu-sep { height: 1px; background: var(--hair); margin: 3px 0; }

  /* table footer */
  .tbl-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-top: 1px solid var(--hair);
    background: var(--hair-2); font-size: 12.5px; color: var(--muted);
  }
  .tbl-foot b { color: var(--ink-2); font-weight: 500; }
  .pager { display: flex; align-items: center; gap: 4px; }
  .pg-btn {
    appearance: none; border: 1px solid var(--hair); background: var(--white);
    height: 28px; min-width: 28px; padding: 0 8px; border-radius: 5px;
    color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; cursor: default;
  }
  .pg-btn:hover { background: var(--hair-2); }
  .pg-btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pg-btn[disabled] { opacity: 0.4; }

  /* ── DRAWER ── */
  .drawer-scrim {
    position: fixed; inset: 0; background: rgba(17,24,39,0.22);
    z-index: 40; animation: fadeIn .16s ease;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .drawer {
    position: fixed; right: 0; top: 0; bottom: 0;
    width: var(--drawer-w); background: var(--white);
    border-left: 1px solid var(--hair); box-shadow: var(--shadow-drawer);
    z-index: 41; display: flex; flex-direction: column;
    animation: drawerIn .22s cubic-bezier(.2,.85,.3,1);
  }
  @keyframes drawerIn { from { transform:translateX(20px); opacity:0; } to { transform:translateX(0); opacity:1; } }

  .drawer-head {
    padding: 16px 18px 14px; border-bottom: 1px solid var(--hair);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .drawer-head .left { display: flex; gap: 12px; min-width: 0; flex: 1; }
  .drawer-head .meta { min-width: 0; flex: 1; }
  .drawer-head .meta .dname { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.2; letter-spacing: -0.01em; }
  .drawer-head .meta .dsub  { font-size: 12px; color: var(--muted-2); margin-top: 2px; }
  .drawer-head .meta .dpills { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .drawer-close {
    width: 28px; height: 28px; border: 1px solid var(--hair); border-radius: 5px;
    background: var(--white); color: var(--muted);
    display: grid; place-items: center; cursor: default; flex-shrink: 0; appearance: none;
  }
  .drawer-close:hover { background: var(--hair-2); color: var(--ink-2); }

  .drawer-tabs { display: flex; border-bottom: 1px solid var(--hair); padding: 0 18px; }
  .drawer-tab {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 13px; font-weight: 400; color: var(--muted);
    padding: 10px 0 9px; margin-right: 20px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    cursor: default; display: inline-flex; align-items: center; gap: 6px;
    transition: color .14s, border-color .14s;
  }
  .drawer-tab:hover { color: var(--ink-2); }
  .drawer-tab.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
  .drawer-tab .cnt {
    font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
    background: var(--hair-2); color: var(--muted); border: 1px solid var(--hair);
  }
  .drawer-tab.on .cnt { background: var(--primary-light); color: var(--primary); border-color: var(--primary-border); }

  .drawer-body { flex: 1; overflow-y: auto; padding: 18px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-tile {
    background: var(--hair-2); border: 1px solid var(--hair); border-radius: 7px;
    padding: 11px 12px 10px;
  }
  .stat-tile .slbl { font-size: 11px; color: var(--muted-2); font-weight: 500; margin-bottom: 4px; }
  .stat-tile .sval { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1; letter-spacing: -0.01em; }
  .stat-tile .sval.green { color: var(--success); }
  .stat-tile .sval.amber { color: var(--amber); }
  .stat-tile .ssub { font-size: 11.5px; color: var(--muted-2); margin-top: 3px; }

  .drawer-sh {
    font-size: 11px; font-weight: 500; color: var(--muted-2);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 16px 0 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-sh:first-child { margin-top: 0; }
  .drawer-sh .act { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--primary); font-weight: 400; cursor: default; }
  .drawer-sh .act:hover { text-decoration: underline; }

  .field-group { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--ink-2); }
  .field .text-in, .field .select-in {
    appearance: none; width: 100%; height: 34px; padding: 0 10px;
    border-radius: 6px; border: 1px solid var(--hair); background: var(--white);
    font: inherit; font-size: 13.5px; color: var(--ink); outline: none;
    transition: border-color .14s, box-shadow .14s;
  }
  .field .text-in:focus, .field .select-in:focus { border-color: var(--primary); box-shadow: var(--focus-ring); }
  .field .select-in {
    padding-right: 28px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%236B7280' d='M0 0h10L5 6z'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center;
  }

  .session-list { display: flex; flex-direction: column; gap: 6px; }
  .session-card {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 10px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--hair);
    border-radius: 7px; background: var(--white); cursor: default;
    transition: border-color .12s, background .12s; text-decoration: none;
  }
  .session-card:hover { border-color: #D1D5DB; background: var(--hair-2); }
  .session-card .sc-title { font-size: 13px; color: var(--ink-2); font-weight: 500; line-height: 1.3; }
  .session-card .sc-meta  { font-size: 11.5px; color: var(--muted-2); margin-top: 2px; }
  .session-card .sc-chev  { color: var(--muted-2); }

  .score-pill {
    display: inline-flex; align-items: center;
    padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 600; border: 1px solid transparent;
  }
  .score-pill .d { font-weight: 400; opacity: 0.65; font-size: 10.5px; margin-left: 1px; }
  .score-pill.green { background: var(--success-tint); color: var(--success); border-color: var(--success-border); }
  .score-pill.amber { background: var(--amber-tint);   color: var(--amber);   border-color: var(--amber-border); }
  .score-pill.red   { background: var(--danger-tint);  color: var(--danger);  border-color: var(--danger-border); }

  .empty-state {
    text-align: center; padding: 36px 20px;
    color: var(--muted); font-size: 13.5px; line-height: 1.6;
  }
  .empty-state .ico-tile {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--hair-2); color: var(--muted-2);
    display: grid; place-items: center; margin: 0 auto 12px;
  }
  .empty-state .t { font-weight: 500; color: var(--ink-2); margin-bottom: 4px; }

  .drawer-foot {
    padding: 12px 18px; border-top: 1px solid var(--hair);
    background: var(--hair-2);
    display: flex; align-items: center; gap: 8px;
  }
  .drawer-foot .spacer { flex: 1; }
  .danger-link {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 13px; color: var(--danger); cursor: default; padding: 0;
  }
  .danger-link:hover { text-decoration: underline; }
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

    /* Page head */
    .page-head { padding-bottom: 12px !important; }
    .page-head h1 { font-size: 18px !important; }

    .btn { display: none !important; }

    /* Tabs — show only strip, no interaction */
    .tabs-strip { margin-bottom: 12px !important; }

    /* Search bar hidden */
    .toolbar { display: none !important; }
