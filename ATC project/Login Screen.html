<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SpeakIQ — Sign in</title>
<meta name="viewport" content="width=1440, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy-0: #0a1326;
    --navy-1: #0f172a;
    --navy-2: #172033;
    --navy-line: rgba(255,255,255,0.08);
    --navy-line-strong: rgba(255,255,255,0.16);
    --ink: #0b1220;
    --ink-2: #1f2a3d;
    --muted: #5b6577;
    --muted-2: #8892a3;
    --hair: #e6e9ef;
    --hair-2: #eef0f4;
    --bg: #ffffff;
    --primary: #2563eb;
    --primary-600: #1e54d4;
    --primary-700: #1a47b8;
    --primary-tint: #eef4ff;
    --focus-ring: rgba(37, 99, 235, 0.18);
    --danger: #d33a3a;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f4f5f7; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv11', 'ss01', 'ss03';
  }

  /* Full bleed shell */
  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
  }

  /* ─────────────── LEFT BRAND PANEL ─────────────── */
  .brand {
    position: relative;
    background: var(--navy-1);
    color: #e8ecf3;
    overflow: hidden;
    isolation: isolate;
    padding: 44px 56px 40px;
    display: flex;
    flex-direction: column;
  }

  .brand .pattern {
    position: absolute; inset: 0; z-index: 0;
    pointer-events: none;
  }

  .brand .vignette {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(60% 50% at 18% 90%, rgba(37,99,235,0.22), transparent 70%),
      radial-gradient(45% 40% at 90% 10%, rgba(56,189,248,0.10), transparent 70%);
  }

  .brand > * { position: relative; z-index: 2; }

  .brand-top {
    display: flex; align-items: center; justify-content: space-between;
  }

  .logo {
    display: inline-flex; align-items: center; gap: 12px;
    color: #fff;
  }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(135deg, #ffffff 0%, #e7eefc 100%);
    color: var(--navy-1);
    display: grid; place-items: center;
    font-weight: 700; letter-spacing: -0.02em;
    font-size: 16px;
    box-shadow:
      inset 0 0 0 0.5px rgba(255,255,255,0.6),
      0 6px 18px rgba(0,0,0,0.25);
  }
  .logo-wordmark {
    font-weight: 600; font-size: 15px; letter-spacing: -0.005em;
    color: rgba(255,255,255,0.92);
  }
  .logo-wordmark .dot { color: #6ea8ff; margin: 0 6px; }

  .brand-meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.06em;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
  }
  .brand-meta b { color: rgba(255,255,255,0.75); font-weight: 500; }

  .brand-body {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    max-width: 520px;
    padding: 48px 0;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-bottom: 22px;
  }
  .eyebrow::before {
    content: ""; width: 22px; height: 1px; background: rgba(255,255,255,0.4);
  }

  .platform-name {
    font-size: 64px;
    line-height: 1.02;
    letter-spacing: -0.035em;
    font-weight: 600;
    color: #ffffff;
    margin: 0 0 18px;
  }
  .platform-name .iq {
    background: linear-gradient(180deg, #ffffff 0%, #9ec0ff 130%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }

  .tagline {
    font-size: 19px;
    line-height: 1.45;
    color: rgba(232,236,243,0.78);
    max-width: 440px;
    margin: 0 0 40px;
    font-weight: 400;
    letter-spacing: -0.005em;
  }

  .feature-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px 28px;
    max-width: 460px;
  }
  .feature {
    display: flex; align-items: flex-start; gap: 10px;
    color: rgba(232,236,243,0.72);
    font-size: 13px; line-height: 1.45;
  }
  .feature .tick {
    width: 16px; height: 16px; flex: 0 0 16px; border-radius: 50%;
    background: rgba(110,168,255,0.14);
    color: #9ec0ff;
    display: grid; place-items: center;
    margin-top: 1px;
  }

  .brand-foot {
    display: flex; align-items: center; justify-content: space-between;
    color: rgba(255,255,255,0.42);
    font-size: 12px;
  }
  .brand-foot .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    border: 1px solid var(--navy-line);
    border-radius: 999px;
    background: rgba(255,255,255,0.02);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  .brand-foot .pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,0.18);
  }

  /* ─────────────── RIGHT FORM PANEL ─────────────── */
  .form-pane {
    background: var(--bg);
    display: flex; flex-direction: column;
    padding: 36px 56px 28px;
    position: relative;
  }

  .form-top {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
  }
  .lang-switch {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 11px; border-radius: 8px;
    border: 1px solid var(--hair);
    background: #fff;
    font-size: 12.5px; color: var(--ink-2);
    font-weight: 500;
    cursor: default;
  }
  .lang-switch:hover { border-color: #d6dbe4; }
  .lang-switch svg { opacity: 0.55; }

  .form-wrap {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center;
  }
  .form {
    width: 100%;
    max-width: 380px;
  }

  .form h1 {
    font-size: 28px;
    letter-spacing: -0.022em;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .form .sub {
    font-size: 14.5px;
    color: var(--muted);
    margin: 0 0 32px;
    line-height: 1.5;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-2);
    margin-bottom: 7px;
    letter-spacing: -0.002em;
  }

  .input-wrap {
    position: relative;
  }
  .input {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px solid var(--hair);
    background: #fff;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    outline: none;
  }
  .input::placeholder { color: #a3acba; }
  .input:hover { border-color: #d6dbe4; }
  .input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--focus-ring);
    background: #fff;
  }
  .input.has-toggle { padding-right: 46px; }
  .input.error {
    border-color: var(--danger);
    box-shadow: 0 0 0 4px rgba(211, 58, 58, 0.12);
  }

  .toggle-eye {
    position: absolute;
    right: 6px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px;
    display: grid; place-items: center;
    background: transparent; border: 0; border-radius: 8px;
    color: var(--muted-2); cursor: default;
  }
  .toggle-eye:hover { background: #f3f5f9; color: var(--ink-2); }

  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 22px;
  }
  .checkbox {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--ink-2);
    cursor: default; user-select: none;
  }
  .checkbox input { position: absolute; opacity: 0; pointer-events: none; }
  .checkbox .box {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid #c8cfdb;
    display: grid; place-items: center;
    background: #fff;
    transition: all .15s ease;
  }
  .checkbox input:checked + .box {
    background: var(--primary); border-color: var(--primary);
  }
  .checkbox input:checked + .box svg { opacity: 1; }
  .checkbox .box svg { opacity: 0; color: #fff; }

  .link {
    color: var(--primary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
  }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }

  .btn {
    appearance: none; border: 0; cursor: default;
    width: 100%; height: 46px;
    border-radius: 10px;
    font: inherit; font-size: 14.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background-color .15s ease, transform .05s ease, box-shadow .15s ease, border-color .15s ease;
    letter-spacing: -0.005em;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 6px 14px rgba(37,99,235,0.28);
  }
  .btn-primary:hover { background: var(--primary-600); }
  .btn-primary:active { background: var(--primary-700); transform: translateY(0.5px); }
  .btn-primary.loading { color: rgba(255,255,255,0); pointer-events: none; }
  .btn-primary .spinner {
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-outline {
    background: #fff;
    border: 1px solid var(--hair);
    color: var(--ink);
    font-weight: 500;
  }
  .btn-outline:hover { border-color: #c5ccd9; background: #fbfcfd; }

  .divider {
    display: flex; align-items: center; gap: 14px;
    color: #a3acba; font-size: 12px;
    margin: 22px 0;
    letter-spacing: 0.01em;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--hair-2);
  }

  .form-foot {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid var(--hair-2);
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
  }
  .form-foot .accent {
    color: var(--ink-2); font-weight: 500;
  }

  .legal {
    margin-top: 18px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--muted-2);
  }
  .legal a { color: var(--muted); text-decoration: none; }
  .legal a:hover { color: var(--ink); }
  .legal .sep { width: 3px; height: 3px; border-radius: 50%; background: #d6dbe4; }
  .legal .right { display: inline-flex; align-items: center; gap: 10px; }

  /* Inline alert (for invalid demo) */
  .alert {
    display: flex; align-items: flex-start; gap: 10px;
    background: #fef2f2; border: 1px solid #fbd5d5; color: #8a2a2a;
    padding: 10px 12px; border-radius: 10px;
    font-size: 13px; line-height: 1.4;
    margin-bottom: 14px;
  }
  .alert svg { flex: 0 0 16px; margin-top: 1px; color: var(--danger); }

  /* Field hint */
  .field-hint {
    font-size: 12px;
    color: var(--danger);
    margin-top: 6px;
    display: flex; align-items: center; gap: 6px;
  }

  /* Mono caps used for "BETA" or similar */
  .mono-cap {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  /* Responsive guard — desktop only as specified */
  @media (max-width: 880px) {
    .shell { grid-template-columns: 1fr; }
    .brand { display: none; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="patterns.jsx"></script>

</body>
</html>
