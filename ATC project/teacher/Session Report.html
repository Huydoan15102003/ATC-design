<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SpeakIQ — Session Report</title>
<meta name="viewport" content="width=1440, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #0b1220;
    --ink-2: #1f2a3d;
    --ink-3: #2c3a52;
    --muted: #5b6577;
    --muted-2: #8892a3;
    --muted-3: #a3acba;
    --hair: #e6e9ef;
    --hair-2: #eef0f4;
    --hair-3: #f2f4f8;
    --bg: #ffffff;
    --canvas: #f7f8fb;
    --canvas-2: #f3f5f9;
    --primary: #2563eb;
    --primary-600: #1e54d4;
    --primary-700: #1a47b8;
    --primary-tint: #eef4ff;
    --primary-tint-2: #e0ebff;
    --focus-ring: rgba(37, 99, 235, 0.18);
    --success: #16a34a;
    --success-2: #15803d;
    --success-tint: #e9f7ee;
    --success-tint-2: #d4ecdd;
    --warn: #d97706;
    --warn-2: #b45309;
    --warn-tint: #fef3e2;
    --warn-tint-2: #fce7c4;
    --danger: #dc2626;
    --danger-tint: #fdecec;
    --danger-tint-2: #f8d4d4;
    --navy-1: #0f172a;
    --shadow-card:   0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.05);
    --shadow-card-2: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--canvas);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv11', 'ss01', 'ss03';
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }

  /* ─────────────── SIDEBAR ─────────────── */
  .sidebar {
    background: #ffffff;
    border-right: 1px solid var(--hair);
    display: flex; flex-direction: column;
    padding: 22px 12px 20px;
    position: sticky; top: 0; align-self: start;
    height: 100vh;
  }
  .sb-logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; margin-bottom: 6px; border-bottom: 1px solid var(--hair-2); }
  .sb-logo .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--navy-1); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: -0.01em; }
  .sb-logo .text { line-height: 1.1; }
  .sb-logo .name { font-size: 13.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.005em; }
  .sb-logo .org  { font-size: 11px; color: var(--muted-2); margin-top: 2px; font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.04em; text-transform: uppercase; }

  .sb-section { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-3); padding: 18px 12px 8px; }
  .sb-nav { display: flex; flex-direction: column; gap: 2px; }
  .sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); font-size: 13.5px; font-weight: 450; cursor: default; position: relative; border-left: 3px solid transparent; padding-left: 9px; transition: background-color .15s ease, color .15s ease; }
  .sb-item:hover { background: var(--hair-3); }
  .sb-item .ico { color: var(--muted); display: grid; place-items: center; }
  .sb-item.active { background: var(--primary-tint); color: var(--primary-700); border-left-color: var(--primary); font-weight: 500; }
  .sb-item.active .ico { color: var(--primary); }
  .sb-badge { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--primary); background: #fff; border: 1px solid var(--primary-tint-2); padding: 1px 6px; border-radius: 999px; }

  .sb-foot { margin-top: auto; padding: 10px 4px 0; border-top: 1px solid var(--hair-2); }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: default; }
  .sb-user:hover { background: var(--hair-3); }
  .sb-user .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #6ea8ff); color: #fff; font-weight: 600; font-size: 12px; display: grid; place-items: center; letter-spacing: -0.01em; }
  .sb-user .meta { line-height: 1.15; flex: 1; min-width: 0; }
  .sb-user .name { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-user .role { font-size: 11px; color: var(--muted-2); margin-top: 2px; }

  /* ─────────────── TOP BAR ─────────────── */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--hair);
    height: 56px;
    display: flex; align-items: center;
    padding: 0 32px;
    gap: 14px;
    position: sticky; top: 0; z-index: 5;
  }
  .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .breadcrumb .sep { color: var(--muted-3); }
  .breadcrumb .now { color: var(--ink); font-weight: 500; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .top-btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hair); background: #fff; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; cursor: default; }
  .top-btn:hover { border-color: #d6dbe4; background: #fbfcfd; }
  .top-btn .ico { color: var(--muted); }

  /* ─────────────── PAGE ─────────────── */
  .page {
    padding: 32px 36px 80px;
    max-width: 1180px;
    margin: 0 auto;
    width: 100%;
  }

  /* page head */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--hair); margin-bottom: 28px; }
  .page-head .ph-left { min-width: 0; }
  .page-head .ph-eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 8px; display: inline-flex; align-items: center; gap: 8px; }
  .page-head .ph-eyebrow::before { content: ""; width: 14px; height: 1px; background: currentColor; opacity: 0.55; }
  .page-head h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 8px; color: var(--ink); }
  .page-head .ph-meta { color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 0; flex-wrap: wrap; line-height: 1.5; }
  .page-head .ph-meta .dot { color: var(--muted-3); margin: 0 9px; }
  .page-head .ph-meta b { color: var(--ink-2); font-weight: 500; }

  .btn {
    appearance: none; border: 0; cursor: default;
    height: 38px;
    padding: 0 14px;
    border-radius: 9px;
    font: inherit; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease;
    letter-spacing: -0.005em;
    white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 6px 14px rgba(37,99,235,0.22); }
  .btn-primary:hover { background: var(--primary-600); }
  .btn-outline { background: #fff; border: 1px solid var(--hair); color: var(--ink-2); }
  .btn-outline:hover { border-color: #c5ccd9; background: #fbfcfd; }
  .btn-soft { background: var(--primary-tint); color: var(--primary); }
  .btn-soft:hover { background: var(--primary-tint-2); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--ink-2); background: var(--hair-3); }

  /* section blocks */
  .section { margin-top: 36px; }
  .section:first-of-type { margin-top: 0; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .section-head .left { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
  .section-head .eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-2); }
  .section-head h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin: 0; color: var(--ink); }
  .section-head .avg { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; letter-spacing: 0.04em; color: var(--muted-2); }
  .section-head .avg b { font-size: 13.5px; font-weight: 600; }

  /* ─────────────── INLINE SCORE ROW (inside tab panels) ─────────────── */
  .score-row {
    display: flex; align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
    margin: 4px 4px 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .score-row .item {
    display: inline-flex; align-items: baseline; gap: 8px;
    white-space: nowrap;
  }
  .score-row .item .k {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted-2);
    font-weight: 500;
  }
  .score-row .item .v {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .score-row .item.lead .v { font-size: 38px; letter-spacing: -0.02em; }
  .score-row .item.lead .k { font-size: 11.5px; }
  .score-row .item .d {
    font-size: 13px;
    color: var(--muted-2);
    font-weight: 500;
    margin-left: -2px;
  }
  .score-row .item.lead .d { font-size: 15px; }
  .score-row .sep {
    color: var(--muted-3);
    font-size: 14px;
    user-select: none;
  }

  /* ─────────────── SECTION 1 — score groups ─────────────── */
  .metrics-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
  }
  .metric-group { display: flex; flex-direction: column; min-width: 0; }
  .metric-group .group-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .metric-group .group-head .label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-2);
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .metric-group .group-head .label::before {
    content: ""; width: 14px; height: 1px;
    background: var(--muted-2);
  }
  .metric-group .group-head .gh-summary {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.06em;
    color: var(--muted-2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .metric-group .group-head .gh-summary b {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .metric-group .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .metric {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 12px;
    padding: 22px 22px 20px;
    box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; gap: 14px;
  }
  .metric.primary { background: linear-gradient(180deg, #f9fbff, #ffffff); }
  .metric .m-eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2); display: flex; align-items: center; justify-content: space-between; }
  .metric .m-eyebrow .verdict { font-size: 10.5px; letter-spacing: 0.06em; }
  .metric .m-eyebrow .verdict.good { color: var(--success-2); }
  .metric .m-eyebrow .verdict.warn { color: var(--warn-2); }
  .metric .m-eyebrow .verdict.bad  { color: var(--danger); }
  .metric .m-num { display: flex; align-items: baseline; gap: 4px; line-height: 1; }
  .metric .m-num .n { font-size: 40px; font-weight: 600; letter-spacing: -0.028em; }
  .metric .m-num .d { font-size: 15px; color: var(--muted-2); font-weight: 500; }
  .metric.primary .m-num .n { font-size: 48px; }
  .metric .m-bar { height: 4px; border-radius: 999px; background: var(--hair-2); overflow: hidden; }
  .metric .m-bar .fill { height: 100%; border-radius: inherit; transition: width .4s ease; }
  .metric .m-label { font-size: 13.5px; color: var(--muted); }
  .metric .m-label b { color: var(--ink-2); font-weight: 500; }

  /* ─────────────── SECTION 2 — speaking ratio ─────────────── */
  .ratio-card {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 12px;
    padding: 20px 24px 22px;
    box-shadow: var(--shadow-card);
  }
  .ratio-bar {
    height: 32px;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    background: var(--hair-2);
    position: relative;
  }
  .ratio-bar .seg {
    height: 100%;
    display: flex; align-items: center;
    padding: 0 14px;
    font-size: 12.5px;
    font-weight: 500;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.02em;
    transition: width .4s ease;
    min-width: 90px;
  }
  .ratio-bar .seg.student {
    background: var(--primary);
    color: #fff;
    justify-content: flex-start;
  }
  .ratio-bar .seg.teacher {
    background: var(--hair-2);
    color: var(--ink-3);
    justify-content: flex-end;
  }
  .ratio-bar .seg .who { opacity: 0.75; margin-right: 6px; font-weight: 450; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.1em; }
  .ratio-bar .seg.teacher .who { color: var(--muted); }

  .ratio-note {
    margin-top: 14px;
    display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; color: var(--muted);
  }
  .ratio-note .pill-check {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--success-tint);
    color: var(--success-2);
    font-size: 11.5px; font-weight: 500;
    letter-spacing: -0.005em;
  }
  .ratio-note .pill-check.bad  { background: var(--warn-tint);   color: var(--warn-2); }
  .ratio-note .target {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted-2);
    letter-spacing: 0.02em;
  }
  .ratio-note .target b { color: var(--ink-2); font-weight: 500; }

  /* ─────────────── TABS ─────────────── */
  .tabs-strip {
    display: flex;
    align-items: stretch;
    gap: 2px;
    border-bottom: 1px solid var(--hair);
    margin-top: 36px;
    margin-bottom: 24px;
    position: sticky;
    top: 56px;
    background: var(--canvas);
    z-index: 4;
  }
  .tab {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 14px; font-weight: 500;
    color: var(--muted);
    padding: 14px 4px 13px;
    margin-right: 22px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: default;
    display: inline-flex; align-items: center; gap: 9px;
    letter-spacing: -0.008em;
    transition: color .15s ease, border-color .15s ease;
    position: relative;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.on {
    color: var(--ink);
    border-bottom-color: var(--primary);
    font-weight: 600;
  }
  .tab .ico { color: var(--muted-2); display: grid; place-items: center; }
  .tab.on  .ico { color: var(--primary); }
  .tab .count {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--muted-2);
    background: var(--hair-3);
    border: 1px solid var(--hair);
    padding: 1px 7px;
    border-radius: 999px;
    font-weight: 500;
  }
  .tab.on .count {
    background: var(--primary-tint);
    color: var(--primary);
    border-color: var(--primary-tint-2);
  }
  .tabs-meta {
    margin-left: auto;
    align-self: center;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.04em;
    color: var(--muted-2);
    padding-right: 2px;
  }
  .tabs-meta b { font-size: 13px; font-weight: 600; }

  .tab-panel {
    display: flex; flex-direction: column;
    gap: 14px;
  }

  /* sub-section title inside a tab panel */
  .panel-sub {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .panel-sub .t {
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    letter-spacing: -0.005em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .panel-sub .t .lbl {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2);
    font-weight: 500;
  }
  .panel-sub .meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.04em;
    color: var(--muted-2);
  }

  /* ─────────────── PRON LIST ─────────────── */
  .pron-list {
    display: flex; flex-direction: column; gap: 8px;
  }
  .pron-row {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 11px;
    transition: border-color .15s ease, box-shadow .15s ease;
    overflow: hidden;
  }
  .pron-row:hover { border-color: #d6dbe4; }
  .pron-row.open { box-shadow: var(--shadow-card); }
  .pron-row .pr-head {
    display: grid;
    grid-template-columns: 36px 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    cursor: default;
  }
  .pron-row .pr-num {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted-2);
    letter-spacing: 0.04em;
  }
  .pron-row .pr-sent {
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.45;
    letter-spacing: -0.005em;
    min-width: 0;
  }
  .pron-row .pr-score {
    display: inline-flex; align-items: baseline; gap: 3px;
    padding: 4px 12px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.005em;
  }
  .pron-row .pr-score .d { font-size: 11px; opacity: 0.6; font-weight: 500; }
  .pron-row .pr-score.good { background: var(--success-tint); color: var(--success-2); }
  .pron-row .pr-score.warn { background: var(--warn-tint);    color: var(--warn-2); }
  .pron-row .pr-score.bad  { background: var(--danger-tint);  color: var(--danger); }

  .pron-row .pr-chev {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 7px;
    color: var(--muted-2);
    transition: transform .2s ease, background-color .15s ease;
  }
  .pron-row:hover .pr-chev { background: var(--hair-3); color: var(--ink-2); }
  .pron-row.open .pr-chev { transform: rotate(90deg); }

  .pron-row .pr-body {
    border-top: 1px dashed var(--hair-2);
    padding: 14px 16px 16px 66px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: start;
  }
  .pron-row .pr-feedback {
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-3);
    max-width: 600px;
  }
  .pron-row .pr-feedback .lead {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--muted-2);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    margin-right: 8px;
    vertical-align: middle;
  }
  .pron-row .pr-feedback code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    background: var(--hair-3);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--ink-2);
  }
  .pron-row .pr-subs {
    display: flex; gap: 6px;
    flex-shrink: 0;
  }

  .sub-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 500;
    background: var(--hair-3);
    color: var(--ink-2);
    border: 1px solid var(--hair-2);
  }
  .sub-pill .label { color: var(--muted); font-weight: 450; font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .sub-pill .v { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .sub-pill.good { background: var(--success-tint); color: var(--success-2); border-color: var(--success-tint-2); }
  .sub-pill.warn { background: var(--warn-tint);    color: var(--warn-2);    border-color: var(--warn-tint-2); }
  .sub-pill.bad  { background: var(--danger-tint);  color: var(--danger);    border-color: var(--danger-tint-2); }
  .sub-pill.good .label, .sub-pill.warn .label, .sub-pill.bad .label { color: inherit; opacity: 0.7; }

  /* ─────────────── SECTION 4 — transcript ─────────────── */
  .transcript-tools {
    display: flex; align-items: center; gap: 10px;
  }
  .segmented {
    display: inline-flex;
    background: var(--hair-3);
    border: 1px solid var(--hair);
    border-radius: 9px;
    padding: 2px;
    gap: 0;
  }
  .segmented button {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 12.5px; font-weight: 500;
    padding: 5px 12px;
    border-radius: 7px;
    color: var(--muted);
    cursor: default;
    transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
    letter-spacing: -0.005em;
  }
  .segmented button.on {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 0 0 1px var(--hair);
  }

  .transcript {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: 22px 22px 18px;
    box-shadow: var(--shadow-card);
  }
  .turns {
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .turn {
    display: flex;
    flex-direction: column;
    max-width: 78%;
  }
  .turn.teacher { align-self: flex-start; align-items: flex-start; }
  .turn.student { align-self: flex-end; align-items: flex-end; }
  .turn .who {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 5px;
    padding: 0 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .turn .who .time { color: var(--muted-3); }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
    letter-spacing: -0.005em;
    word-wrap: break-word;
    border: 1px solid transparent;
  }
  .turn.teacher .bubble {
    background: var(--hair-3);
    border-color: var(--hair-2);
    color: var(--ink-2);
    border-top-left-radius: 4px;
  }
  .turn.student .bubble {
    background: var(--primary-tint);
    border-color: var(--primary-tint-2);
    color: var(--ink);
    border-top-right-radius: 4px;
  }

  /* highlighted spans */
  .hl {
    position: relative;
    cursor: default;
    padding: 0 1px;
    border-radius: 2px;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }
  .hl.good { text-decoration-color: var(--success); background: rgba(22,163,74,0.08); }
  .hl.warn { text-decoration-color: var(--warn);    background: rgba(217,119,6,0.10); }
  .hl.bad  { text-decoration-color: var(--danger);  background: rgba(220,38,38,0.08); }

  .hl .tip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #0f172a;
    color: #fff;
    font-size: 12px;
    font-weight: 450;
    line-height: 1.45;
    padding: 8px 11px;
    border-radius: 7px;
    width: max-content;
    max-width: 260px;
    text-align: center;
    white-space: normal;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 10;
    letter-spacing: -0.005em;
    box-shadow: 0 6px 18px rgba(15,23,42,0.18);
  }
  .hl .tip::after {
    content: "";
    position: absolute;
    top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #0f172a;
  }
  .hl .tip .k {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
    opacity: 0.7;
    display: block;
    margin-bottom: 3px;
  }
  .hl.good .tip .k { color: #6df1a3; }
  .hl.warn .tip .k { color: #fcd07a; }
  .hl.bad  .tip .k { color: #fca5a5; }
  .hl:hover .tip { opacity: 1; transform: translateX(-50%) translateY(-2px); }

  .transcript-foot {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--hair-2);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .transcript-foot .left {
    display: flex; align-items: center; gap: 14px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted);
  }
  .transcript-foot .legend {
    display: flex; gap: 10px;
  }
  .transcript-foot .legend .it { display: inline-flex; align-items: center; gap: 5px; }
  .transcript-foot .legend .sw { width: 8px; height: 8px; border-radius: 50%; }
  .transcript-foot .legend .sw.g { background: var(--success); }
  .transcript-foot .legend .sw.a { background: var(--warn); }
  .transcript-foot .legend .sw.r { background: var(--danger); }

  /* grammar notes */
  .grammar-card {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 12px;
    box-shadow: var(--shadow-card);
    margin-top: 14px;
    overflow: hidden;
  }
  .grammar-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    cursor: default;
  }
  .grammar-head .ico-tile {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--primary-tint);
    color: var(--primary);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .grammar-head .title { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; color: var(--ink); }
  .grammar-head .sub   { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .grammar-head .meta  { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .grammar-head .count {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.04em;
    color: var(--muted-2);
  }
  .grammar-head .chev {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 7px;
    color: var(--muted-2);
    transition: transform .2s ease;
  }
  .grammar-card.open .grammar-head .chev { transform: rotate(180deg); }

  .grammar-body {
    border-top: 1px dashed var(--hair-2);
    padding: 6px 18px 18px;
  }
  .grammar-body ul {
    list-style: none;
    padding: 0; margin: 0;
    display: flex; flex-direction: column;
    gap: 0;
  }
  .grammar-body li {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 8px;
    padding: 14px 0;
    border-bottom: 1px dashed var(--hair-2);
  }
  .grammar-body li:last-child { border-bottom: 0; padding-bottom: 6px; }
  .grammar-body .idx {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--muted-2);
    padding-top: 3px;
  }
  .grammar-body .pattern {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.005em;
    margin-bottom: 4px;
  }
  .grammar-body .example {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
  }
  .grammar-body .example code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    background: var(--hair-3);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--ink-2);
  }
  .grammar-body .example .strike { text-decoration: line-through; text-decoration-color: var(--danger); color: var(--muted); }
  .grammar-body .example .fix    { color: var(--success-2); font-weight: 500; }

  /* footer cta */
  .report-foot {
    margin-top: 40px;
    padding: 22px 24px;
    background: var(--canvas-2);
    border: 1px solid var(--hair);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px;
  }
  .report-foot .copy {
    font-size: 13.5px; color: var(--muted);
    line-height: 1.5;
  }
  .report-foot .copy b { color: var(--ink-2); font-weight: 600; }
  .report-foot .actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* responsive guard */
  @media (max-width: 900px) {
    .metrics-split { grid-template-columns: 1fr; gap: 24px; }
    .turn { max-width: 90%; }
  }
</style>
</head>
