<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SpeakIQ — Upload Session</title>
<meta name="viewport" content="width=1440, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #0b1220;
    --ink-2: #1f2a3d;
    --ink-3: #2c3a52;
    --muted: #5b6577;
    --muted-2: #8892a3;
    --muted-3: #a3acba;
    --hair: #e6e9ef;
    --hair-2: #eef0f4;
    --hair-3: #f2f4f8;
    --bg: #ffffff;
    --canvas: #f7f8fb;
    --primary: #2563eb;
    --primary-600: #1e54d4;
    --primary-700: #1a47b8;
    --primary-tint: #eef4ff;
    --primary-tint-2: #e0ebff;
    --focus-ring: rgba(37, 99, 235, 0.18);
    --success: #16a34a;
    --success-tint: #e9f7ee;
    --warn: #d97706;
    --danger: #d33a3a;
    --navy-1: #0f172a;
    --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.05);
    --shadow-card-2: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--canvas);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv11', 'ss01', 'ss03';
  }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }

  /* ─────────────── SIDEBAR ─────────────── */
  .sidebar {
    background: #ffffff;
    border-right: 1px solid var(--hair);
    display: flex; flex-direction: column;
    padding: 22px 12px 20px;
    position: sticky; top: 0; align-self: start;
    height: 100vh;
  }

  .sb-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 10px 22px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--hair-2);
  }
  .sb-logo .mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--navy-1);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px; letter-spacing: -0.01em;
  }
  .sb-logo .text {
    line-height: 1.1;
  }
  .sb-logo .name {
    font-size: 13.5px; font-weight: 600; color: var(--ink);
    letter-spacing: -0.005em;
  }
  .sb-logo .org {
    font-size: 11px; color: var(--muted-2);
    margin-top: 2px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .sb-section {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted-3);
    padding: 18px 12px 8px;
  }

  .sb-nav { display: flex; flex-direction: column; gap: 2px; }
  .sb-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 450;
    cursor: default;
    position: relative;
    border-left: 3px solid transparent;
    padding-left: 9px;
    transition: background-color .15s ease, color .15s ease;
  }
  .sb-item:hover { background: var(--hair-3); }
  .sb-item .ico { color: var(--muted); display: grid; place-items: center; }
  .sb-item.active {
    background: var(--primary-tint);
    color: var(--primary-700);
    border-left-color: var(--primary);
    font-weight: 500;
  }
  .sb-item.active .ico { color: var(--primary); }

  .sb-badge {
    margin-left: auto;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--primary);
    background: #fff;
    border: 1px solid var(--primary-tint-2);
    padding: 1px 6px; border-radius: 999px;
  }

  .sb-foot {
    margin-top: auto;
    padding: 10px 4px 0;
    border-top: 1px solid var(--hair-2);
  }
  .sb-user {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px;
    border-radius: 8px;
    cursor: default;
  }
  .sb-user:hover { background: var(--hair-3); }
  .sb-user .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #6ea8ff);
    color: #fff; font-weight: 600; font-size: 12px;
    display: grid; place-items: center;
    letter-spacing: -0.01em;
  }
  .sb-user .meta { line-height: 1.15; flex: 1; min-width: 0; }
  .sb-user .name { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-user .role { font-size: 11px; color: var(--muted-2); margin-top: 2px; }

  /* ─────────────── MAIN ─────────────── */
  .main {
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--hair);
    height: 56px;
    display: flex; align-items: center;
    padding: 0 36px;
    gap: 14px;
  }
  .breadcrumb {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .breadcrumb .sep { color: var(--muted-3); }
  .breadcrumb .now { color: var(--ink); font-weight: 500; }

  .top-actions {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
  }
  .top-btn {
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--hair);
    background: #fff;
    color: var(--ink-2);
    font: inherit; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px;
    cursor: default;
  }
  .top-btn:hover { border-color: #d6dbe4; background: #fbfcfd; }
  .top-btn .ico { color: var(--muted); }

  .content {
    padding: 32px 36px 56px;
    max-width: 1180px;
    width: 100%;
  }

  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
  }
  .page-head .title-block { min-width: 0; }
  .page-head .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 8px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .page-head .eyebrow::before {
    content: ""; width: 14px; height: 1px; background: currentColor; opacity: 0.6;
  }
  .page-head h1 {
    font-size: 26px; font-weight: 600;
    letter-spacing: -0.022em;
    margin: 0; color: var(--ink);
  }
  .page-head .sub {
    margin-top: 6px;
    color: var(--muted);
    font-size: 14px;
  }
  .page-head .helper {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--muted);
    padding: 8px 12px;
    border: 1px solid var(--hair);
    border-radius: 8px;
    background: #fff;
  }
  .page-head .helper svg { color: var(--primary); }

  /* ─────────────── STEPPER ─────────────── */
  .stepper {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-card);
    position: relative;
  }
  .step {
    display: flex; align-items: center; gap: 14px;
    cursor: default;
    position: relative;
    padding: 4px 8px;
  }
  .step:not(:last-child)::after {
    content: ""; position: absolute;
    right: -2px;
    top: 50%;
    width: calc(100% - 56px);
    transform: translate(50%, -50%);
    height: 1.5px;
    background: var(--hair);
    z-index: 0;
  }
  .step.done:not(:last-child)::after { background: var(--primary); }

  .step .num {
    width: 28px; height: 28px; flex: 0 0 28px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 12.5px; font-weight: 600;
    background: #fff;
    border: 1.5px solid var(--hair);
    color: var(--muted);
    z-index: 1;
    transition: all .15s ease;
  }
  .step.current .num {
    border-color: var(--primary);
    color: var(--primary);
    box-shadow: 0 0 0 4px var(--focus-ring);
  }
  .step.done .num {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .step .label {
    line-height: 1.1;
    z-index: 1;
    background: #fff;
    padding-right: 14px;
  }
  .step .label .k {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-3);
    margin-bottom: 4px;
    display: block;
  }
  .step .label .t {
    font-size: 13.5px; font-weight: 500; color: var(--ink-2);
  }
  .step.current .label .k { color: var(--primary); }
  .step.current .label .t { color: var(--ink); }
  .step.done .label .k { color: var(--primary); }
  .step.done .label .t { color: var(--ink); }

  /* ─────────────── CARD ─────────────── */
  .card {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 12px;
    padding: 28px 32px;
    box-shadow: var(--shadow-card);
  }
  .card + .card { margin-top: 16px; }
  .card .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
  }
  .card .card-head h2 {
    font-size: 16px; font-weight: 600;
    letter-spacing: -0.012em;
    margin: 0;
  }
  .card .card-head .sub {
    font-size: 13px; color: var(--muted);
    margin-top: 4px;
  }
  .card .card-head .right { color: var(--muted-2); font-size: 12.5px; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 20px;
  }
  .form-grid .col-2 { grid-column: span 2; }

  .field label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-2);
    margin-bottom: 7px;
    letter-spacing: -0.002em;
  }
  .field label .opt {
    font-weight: 400;
    color: var(--muted-2);
    font-size: 12px;
  }

  .input, .textarea {
    width: 100%;
    height: 42px;
    padding: 0 14px;
    border-radius: 9px;
    border: 1px solid var(--hair);
    background: #fff;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
    outline: none;
  }
  .input::placeholder, .textarea::placeholder { color: #a3acba; }
  .input:hover, .textarea:hover { border-color: #d6dbe4; }
  .input:focus, .textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--focus-ring);
  }
  .textarea {
    height: auto;
    min-height: 92px;
    padding: 12px 14px;
    resize: vertical;
    line-height: 1.5;
  }
  .input.with-icon { padding-left: 38px; }
  .input.with-suffix { padding-right: 70px; }

  .input-wrap { position: relative; }
  .input-wrap .lead-ico {
    position: absolute;
    left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted-2);
    pointer-events: none;
  }
  .input-wrap .suffix {
    position: absolute;
    right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }

  /* combobox / dropdown */
  .combo {
    position: relative;
  }
  .combo .menu {
    position: absolute;
    top: calc(100% + 6px); left: 0; right: 0;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 10px;
    box-shadow: var(--shadow-card-2);
    z-index: 10;
    max-height: 260px;
    overflow: auto;
    padding: 6px;
  }
  .combo .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px;
    border-radius: 7px;
    cursor: default;
    font-size: 13.5px;
  }
  .combo .menu-item:hover, .combo .menu-item.hover { background: var(--hair-3); }
  .combo .menu-item.selected { background: var(--primary-tint); color: var(--primary-700); }
  .combo .menu-item .avatar {
    width: 26px; height: 26px; flex: 0 0 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ccd9f3, #e6edfb);
    color: var(--ink-2);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 600;
  }
  .combo .menu-item .meta {
    display: flex; flex-direction: column;
    line-height: 1.15;
  }
  .combo .menu-item .meta .sub {
    font-size: 11.5px; color: var(--muted);
  }
  .combo .pill-selected {
    display: inline-flex; align-items: center; gap: 8px;
  }
  .combo .pill-selected .avatar {
    width: 22px; height: 22px; flex: 0 0 22px; border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #6ea8ff);
    color: #fff; display: grid; place-items: center;
    font-size: 10.5px; font-weight: 600;
  }
  .combo .clear {
    position: absolute;
    right: 36px; top: 50%; transform: translateY(-50%);
    color: var(--muted-2);
    cursor: default;
    background: transparent; border: 0;
    padding: 4px; border-radius: 6px;
  }
  .combo .clear:hover { background: var(--hair-3); color: var(--ink-2); }

  .selectish {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px; height: 42px;
    border-radius: 9px;
    border: 1px solid var(--hair);
    background: #fff;
    cursor: default;
    font-size: 14px;
    color: var(--ink);
  }
  .selectish:hover { border-color: #d6dbe4; }
  .selectish.focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--focus-ring);
  }
  .selectish .placeholder { color: #a3acba; flex: 1; }
  .selectish .body { flex: 1; }
  .selectish .chev { color: var(--muted-2); }

  /* buttons */
  .btn {
    appearance: none; border: 0; cursor: default;
    height: 42px;
    padding: 0 18px;
    border-radius: 9px;
    font: inherit; font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease;
    letter-spacing: -0.005em;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 6px 14px rgba(37,99,235,0.22);
  }
  .btn-primary:hover { background: var(--primary-600); }
  .btn-primary:disabled, .btn-primary.disabled {
    background: #c9d3e6; box-shadow: none; color: #fff;
    cursor: not-allowed;
  }
  .btn-outline {
    background: #fff;
    border: 1px solid var(--hair);
    color: var(--ink-2);
  }
  .btn-outline:hover { border-color: #c5ccd9; background: #fbfcfd; }
  .btn-ghost {
    background: transparent; color: var(--muted);
  }
  .btn-ghost:hover { color: var(--ink-2); background: var(--hair-3); }

  .actions-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 24px;
  }

  /* ─────────────── DROPZONE ─────────────── */
  .dropzone {
    border: 1.5px dashed #c8d3e6;
    border-radius: 14px;
    background: #fbfcfe;
    padding: 44px 28px;
    text-align: center;
    transition: all .15s ease;
    cursor: default;
  }
  .dropzone:hover { border-color: var(--primary); background: var(--primary-tint); }
  .dropzone.dragging { border-color: var(--primary); background: var(--primary-tint); }
  .dropzone .icon-tile {
    width: 56px; height: 56px;
    margin: 0 auto 18px;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 1px 2px rgba(15,23,42,0.06), 0 4px 12px rgba(15,23,42,0.05);
    border: 1px solid var(--hair);
    display: grid; place-items: center;
    color: var(--primary);
  }
  .dropzone h3 {
    font-size: 16px; font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .dropzone .or {
    color: var(--muted);
    font-size: 13.5px;
    margin-bottom: 14px;
  }
  .dropzone .or .link {
    color: var(--primary);
    font-weight: 500;
    text-decoration: none;
  }
  .dropzone .or .link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .dropzone .formats {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--muted-2);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: #fff;
    border: 1px solid var(--hair);
    padding: 6px 12px;
    border-radius: 999px;
  }
  .dropzone .formats .dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--muted-3);
  }

  /* uploaded file */
  .file-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--hair);
    border-radius: 11px;
    background: #fff;
  }
  .file-row .tile {
    width: 44px; height: 44px;
    flex: 0 0 44px;
    border-radius: 10px;
    background: var(--primary-tint);
    color: var(--primary);
    display: grid; place-items: center;
  }
  .file-row .name { font-weight: 500; font-size: 14px; color: var(--ink); }
  .file-row .meta {
    color: var(--muted); font-size: 12.5px;
    margin-top: 3px;
    display: flex; align-items: center; gap: 10px;
  }
  .file-row .meta .sep {
    width: 3px; height: 3px; border-radius: 50%; background: var(--muted-3);
  }
  .file-row .grow { flex: 1; min-width: 0; }
  .file-row .check {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--success-tint); color: var(--success);
    display: grid; place-items: center;
  }
  .file-row .remove {
    background: transparent; border: 0; color: var(--muted);
    padding: 6px; border-radius: 7px; cursor: default;
  }
  .file-row .remove:hover { background: var(--hair-3); color: var(--ink-2); }

  .progress {
    margin-top: 14px;
    height: 6px; border-radius: 999px;
    background: var(--hair-2);
    overflow: hidden;
  }
  .progress .bar {
    height: 100%; background: var(--primary); border-radius: 999px;
    transition: width .25s ease;
  }
  .progress-meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--muted);
    margin-top: 8px;
  }
  .progress-meta b { color: var(--ink-2); font-weight: 500; }

  /* audio waveform mock */
  .waveform {
    margin-top: 14px;
    height: 56px;
    border-radius: 10px;
    border: 1px solid var(--hair);
    background: var(--hair-3);
    display: flex; align-items: center;
    padding: 0 14px;
    gap: 3px;
    overflow: hidden;
  }
  .waveform .bar {
    width: 3px; border-radius: 2px;
    background: linear-gradient(180deg, #93b6f7, #2563eb);
    opacity: 0.85;
  }

  /* ─────────────── REVIEW ─────────────── */
  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 28px;
  }
  .summary .row { display: flex; flex-direction: column; gap: 4px; }
  .summary .k {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted-2);
  }
  .summary .v {
    font-size: 14px; color: var(--ink); font-weight: 500;
  }
  .summary .v.s { font-weight: 400; color: var(--ink-2); }

  .info-banner {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px;
    border-radius: 11px;
    background: var(--primary-tint);
    border: 1px solid var(--primary-tint-2);
    color: var(--primary-700);
    font-size: 13.5px; line-height: 1.5;
    margin-top: 18px;
  }
  .info-banner .ico {
    width: 22px; height: 22px; flex: 0 0 22px;
    border-radius: 50%;
    background: #fff;
    display: grid; place-items: center;
    color: var(--primary);
    margin-top: 1px;
  }
  .info-banner b { color: var(--primary-700); font-weight: 600; }
  .info-banner .light { color: rgba(26, 71, 184, 0.7); }

  /* checkbox row */
  .checkrow {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--hair);
    border-radius: 11px;
    cursor: default;
    user-select: none;
    margin-top: 18px;
  }
  .checkrow:hover { border-color: #d6dbe4; }
  .checkrow .box {
    width: 18px; height: 18px;
    flex: 0 0 18px;
    border-radius: 5px;
    border: 1.5px solid #c8cfdb;
    background: #fff;
    display: grid; place-items: center;
    margin-top: 1px;
  }
  .checkrow input { position: absolute; opacity: 0; pointer-events: none; }
  .checkrow input:checked + .box {
    background: var(--primary); border-color: var(--primary);
  }
  .checkrow input:checked + .box svg { opacity: 1; }
  .checkrow .box svg { color: #fff; opacity: 0; }
  .checkrow .text {
    line-height: 1.45;
  }
  .checkrow .text .t {
    font-size: 13.5px; font-weight: 500; color: var(--ink);
  }
  .checkrow .text .s {
    font-size: 12.5px; color: var(--muted); margin-top: 2px;
  }

  /* date input has native picker icon; we'll style consistent */
  input[type="date"]::-webkit-calendar-picker-indicator {
    cursor: default; opacity: 0.5;
  }

  /* helper sidekick on review */
  .cards-2col {
    display: grid; grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    align-items: start;
  }
  .mini-card {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 12px;
    padding: 20px 22px;
    box-shadow: var(--shadow-card);
  }
  .mini-card h3 {
    font-size: 13px; font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.005em;
    color: var(--ink);
  }
  .mini-card p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }
  .mini-card .pipeline {
    margin-top: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .mini-card .pipeline .step-mini {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--ink-2);
  }
  .mini-card .pipeline .dot-mini {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--primary-tint); color: var(--primary);
    display: grid; place-items: center;
    flex: 0 0 18px;
    font-size: 10px; font-weight: 600;
  }
  .mini-card .pipeline .est {
    margin-left: auto;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; color: var(--muted-2);
    letter-spacing: 0.04em; text-transform: uppercase;
  }

  /* responsive */
  @media (max-width: 1080px) {
    .cards-2col { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .col-2 { grid-column: span 1; }
    .summary { grid-template-columns: 1fr; }
  }
</style>
</head>
