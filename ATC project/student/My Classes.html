<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SpeakIQ — My Classes</title>
<meta name="viewport" content="width=1440, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #0b1220; --ink-2: #1f2a3d; --ink-3: #2c3a52;
    --muted: #5b6577; --muted-2: #8892a3; --muted-3: #a3acba;
    --hair: #e6e9ef; --hair-2: #eef0f4; --hair-3: #f2f4f8;
    --bg: #ffffff; --canvas: #f7f8fb; --canvas-2: #f3f5f9;
    --primary: #2563eb; --primary-600: #1e54d4; --primary-700: #1a47b8;
    --primary-tint: #eef4ff; --primary-tint-2: #e0ebff;
    --focus-ring: rgba(37,99,235,0.18);
    --success: #16a34a; --success-2: #15803d; --success-tint: #e9f7ee; --success-tint-2: #d4ecdd;
    --warn: #d97706;    --warn-2: #b45309;    --warn-tint: #fef3e2;    --warn-tint-2: #fce7c4;
    --danger: #dc2626;  --danger-2: #b91c1c;  --danger-tint: #fdecec;  --danger-tint-2: #f8d4d4;
    --navy-1: #0f172a;
    --shadow-card:   0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.05);
    --shadow-card-2: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
    --shadow-drawer: -20px 0 60px rgba(15,23,42,0.12), -2px 0 8px rgba(15,23,42,0.06);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--canvas);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv11','ss01','ss03';
  }

  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

  /* ── Sidebar (shared) ── */
  .sidebar { background: #fff; border-right: 1px solid var(--hair); display: flex; flex-direction: column; padding: 22px 12px 20px; position: sticky; top: 0; align-self: start; height: 100vh; }
  .sb-logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; margin-bottom: 6px; border-bottom: 1px solid var(--hair-2); }
  .sb-logo .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--navy-1); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .sb-logo .text { line-height: 1.1; }
  .sb-logo .name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .sb-logo .org  { font-size: 11px; color: var(--muted-2); margin-top: 2px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; text-transform: uppercase; }
  .sb-section { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-3); padding: 18px 12px 8px; }
  .sb-nav { display: flex; flex-direction: column; gap: 2px; }
  .sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 9px; border-radius: 8px; color: var(--ink-2); font-size: 13.5px; font-weight: 450; cursor: default; border-left: 3px solid transparent; transition: background-color .15s, color .15s; }
  .sb-item:hover { background: var(--hair-3); }
  .sb-item .ico { color: var(--muted); display: grid; place-items: center; }
  .sb-item.active { background: var(--primary-tint); color: var(--primary-700); border-left-color: var(--primary); font-weight: 500; }
  .sb-item.active .ico { color: var(--primary); }
  .sb-badge { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--primary); background: #fff; border: 1px solid var(--primary-tint-2); padding: 1px 6px; border-radius: 999px; }
  .sb-foot { margin-top: auto; padding: 10px 4px 0; border-top: 1px solid var(--hair-2); }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: default; }
  .sb-user:hover { background: var(--hair-3); }
  .sb-user .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#2563eb,#6ea8ff); color: #fff; font-weight: 600; font-size: 12px; display: grid; place-items: center; }
  .sb-user .meta { line-height: 1.15; flex: 1; min-width: 0; }
  .sb-user .name { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-user .role { font-size: 11px; color: var(--muted-2); margin-top: 2px; }

  /* ── Top bar ── */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #fff; border-bottom: 1px solid var(--hair); height: 56px; display: flex; align-items: center; padding: 0 32px; gap: 14px; position: sticky; top: 0; z-index: 5; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .breadcrumb .sep { color: var(--muted-3); }
  .breadcrumb .now { color: var(--ink); font-weight: 500; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .top-btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hair); background: #fff; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; cursor: default; }
  .top-btn:hover { border-color: #d6dbe4; background: #fbfcfd; }

  /* ── Page ── */
  .page { padding: 32px 36px 80px; max-width: 1280px; margin: 0 auto; width: 100%; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--hair); margin-bottom: 20px; }
  .page-head .ph-left { min-width: 0; }
  .page-head .ph-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 8px; display: inline-flex; align-items: center; gap: 8px; }
  .page-head .ph-eyebrow::before { content: ""; width: 14px; height: 1px; background: currentColor; opacity: 0.55; }
  .page-head h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 8px; color: var(--ink); }
  .page-head .ph-meta { color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 0; flex-wrap: wrap; line-height: 1.5; }
  .page-head .ph-meta .dot { color: var(--muted-3); margin: 0 9px; }
  .page-head .ph-meta b { color: var(--ink-2); font-weight: 500; }

  /* ── Buttons ── */
  .btn { appearance: none; border: 0; cursor: default; height: 38px; padding: 0 14px; border-radius: 9px; font: inherit; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: background-color .15s, border-color .15s, box-shadow .15s; letter-spacing: -0.005em; white-space: nowrap; }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 6px 14px rgba(37,99,235,0.22); }
  .btn-primary:hover { background: var(--primary-600); }
  .btn-outline { background: #fff; border: 1px solid var(--hair); color: var(--ink-2); }
  .btn-outline:hover { border-color: #c5ccd9; background: #fbfcfd; }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }

  /* ── Toolbar ── */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .search-wrap { position: relative; flex: 1; max-width: 360px; }
  .search-wrap .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted-2); pointer-events: none; }
  .search-wrap input { width: 100%; height: 36px; padding: 0 12px 0 36px; border-radius: 9px; border: 1px solid var(--hair); background: #fff; font: inherit; font-size: 13.5px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
  .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--focus-ring); }
  .search-wrap input::placeholder { color: var(--muted-2); }
  .filter-chip { appearance: none; border: 1px solid var(--hair); background: #fff; height: 36px; padding: 0 12px; border-radius: 9px; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; cursor: default; transition: background-color .15s, border-color .15s; }
  .filter-chip:hover { background: #fbfcfd; border-color: #c5ccd9; }
  .filter-chip .ico { color: var(--muted); }
  .filter-chip .chev { color: var(--muted-2); }
  .filter-chip .val { color: var(--muted); font-weight: 450; }
  .filter-chip.active { background: var(--primary-tint); border-color: var(--primary-tint-2); color: var(--primary-700); }
  .filter-chip.active .ico { color: var(--primary); }
  .toolbar .spacer { flex: 1; }

  .view-toggle { display: inline-flex; background: #fff; border: 1px solid var(--hair); border-radius: 9px; padding: 3px; gap: 1px; }
  .vt-btn { appearance: none; border: 0; background: transparent; width: 30px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); cursor: default; transition: background-color .12s, color .12s; }
  .vt-btn:hover { color: var(--ink-2); }
  .vt-btn.on { background: var(--primary-tint); color: var(--primary-700); }

  /* ── Class grid ── */
  .class-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .class-card {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 14px;
    box-shadow: var(--shadow-card);
    padding: 18px 18px 14px;
    display: flex; flex-direction: column; gap: 16px;
    cursor: default;
    transition: border-color .15s, box-shadow .15s, transform .12s;
  }
  .class-card:hover {
    border-color: #cdd3df;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 12px 30px rgba(15,23,42,0.09);
    transform: translateY(-1px);
  }

  .cc-top { display: flex; align-items: flex-start; gap: 12px; }
  .cc-mark {
    width: 44px; height: 44px;
    border-radius: 11px;
    color: #fff;
    display: grid; place-items: center;
    flex-shrink: 0;
    box-shadow: 0 1px 2px rgba(15,23,42,0.08);
  }
  .cc-meta { min-width: 0; flex: 1; line-height: 1.25; }
  .cc-name {
    font-size: 15px; font-weight: 600;
    color: var(--ink); letter-spacing: -0.012em;
    margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cc-sub {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 0; flex-wrap: wrap;
  }
  .cc-sub .dot { color: var(--muted-3); margin: 0 6px; }

  .cc-stats {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    gap: 10px;
    padding: 12px;
    background: var(--canvas);
    border: 1px solid var(--hair-2);
    border-radius: 10px;
  }
  .cc-stat { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .cc-stat .k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2);
  }
  .cc-stat .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px; font-weight: 600; letter-spacing: -0.012em;
    color: var(--ink);
    font-variant-numeric: tabular-nums; line-height: 1;
    display: flex; align-items: center;
  }

  .cc-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 4px;
    border-top: 1px dashed var(--hair-2);
    padding-top: 12px;
    margin-top: -2px;
  }
  .cc-last {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted);
  }
  .cc-last b { color: var(--ink-2); font-weight: 500; }
  .cc-open {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 500;
    color: var(--primary);
    transition: gap .15s;
  }
  .class-card:hover .cc-open { gap: 7px; }

  /* ── Score / level pills ── */
  .score-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px; border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: -0.005em;
    font-variant-numeric: tabular-nums;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .score-pill .d { font-weight: 450; opacity: 0.7; font-size: 10.5px; margin-left: -2px; }
  .score-pill.good { background: var(--success-tint); color: var(--success-2); border-color: var(--success-tint-2); }
  .score-pill.warn { background: var(--warn-tint);    color: var(--warn-2);    border-color: var(--warn-tint-2); }
  .score-pill.bad  { background: var(--danger-tint);  color: var(--danger-2);  border-color: var(--danger-tint-2); }

  .level-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500;
    border: 1px solid transparent; white-space: nowrap;
  }
  .level-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .level-pill.beginner     { background: var(--warn-tint);    color: var(--warn-2);    border-color: var(--warn-tint-2); }
  .level-pill.intermediate { background: var(--primary-tint); color: var(--primary-700); border-color: var(--primary-tint-2); }
  .level-pill.advanced     { background: var(--success-tint); color: var(--success-2); border-color: var(--success-tint-2); }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500;
    border: 1px solid transparent; white-space: nowrap;
  }
  .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-pill.active   { background: var(--success-tint); color: var(--success-2); border-color: var(--success-tint-2); }
  .status-pill.inactive { background: var(--hair-3);       color: var(--muted);     border-color: var(--hair); }

  /* ── List view (table) ── */
  .data-card { background: #fff; border: 1px solid var(--hair); border-radius: 12px; box-shadow: var(--shadow-card); overflow: hidden; }
  table.data { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.data thead th {
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2); font-weight: 500;
    padding: 12px 14px;
    border-bottom: 1px solid var(--hair);
    background: var(--canvas);
    white-space: nowrap;
  }
  table.data tbody td {
    padding: 14px;
    border-bottom: 1px solid var(--hair-2);
    font-size: 13.5px; color: var(--ink-2);
    vertical-align: middle;
  }
  table.data tbody tr:last-child td { border-bottom: 0; }
  table.data tbody tr { transition: background-color .12s; cursor: default; }
  table.data tbody tr:hover { background: var(--hair-3); }
  .ucell { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ucell .meta { min-width: 0; line-height: 1.2; }
  .ucell .name { font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ucell .sub  { font-size: 11.5px; color: var(--muted-2); margin-top: 2px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; }
  .num-cell { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--ink-2); }
  .class-mark-sm { width: 30px; height: 30px; border-radius: 8px; color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .row-open { color: var(--muted-3); display: inline-flex; }
  table.data tbody tr:hover .row-open { color: var(--ink-2); }

  /* ── Empty ── */
  .empty-rows { text-align: center; padding: 60px 20px; }
  .empty-rows .es-ill { width: 56px; height: 56px; border-radius: 14px; background: var(--primary-tint); color: var(--primary); display: grid; place-items: center; margin: 0 auto 14px; }
  .empty-rows .es-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }

  /* ── Drawer ── */
  .drawer-scrim {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.18);
    z-index: 40;
    animation: fadeIn .18s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .drawer {
    position: fixed; right: 0; top: 0; bottom: 0;
    width: 560px;
    background: #fff;
    border-left: 1px solid var(--hair);
    box-shadow: var(--shadow-drawer);
    z-index: 41;
    display: flex; flex-direction: column;
    animation: drawerIn .25s cubic-bezier(.2,.85,.3,1);
  }
  @keyframes drawerIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .drawer-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--hair-2);
    gap: 12px;
  }
  .drawer-head .left { display: flex; gap: 14px; min-width: 0; flex: 1; }
  .drawer-head .meta { min-width: 0; flex: 1; }
  .drawer-head .meta .name {
    font-size: 18px; font-weight: 600; color: var(--ink);
    letter-spacing: -0.012em; line-height: 1.2;
    margin-bottom: 4px;
  }
  .drawer-head .meta .sub {
    font-size: 12px; color: var(--muted-2);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }
  .drawer-head .meta .pills { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .cls-avatar-lg {
    width: 52px; height: 52px;
    border-radius: 13px; color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 1px 2px rgba(15,23,42,0.1);
    flex-shrink: 0;
  }
  .drawer-close {
    appearance: none; border: 0; background: var(--hair-3);
    width: 30px; height: 30px; border-radius: 8px;
    color: var(--muted); display: grid; place-items: center;
    cursor: default; flex-shrink: 0;
  }
  .drawer-close:hover { background: var(--hair-2); color: var(--ink-2); }

  .drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px 20px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat-tile { background: var(--canvas); border: 1px solid var(--hair-2); border-radius: 10px; padding: 12px 12px 11px; }
  .stat-tile .lbl { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 4px; }
  .stat-tile .val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; letter-spacing: -0.012em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat-tile .val.good { color: var(--success-2); }
  .stat-tile .val.warn { color: var(--warn-2); }
  .stat-tile .val.bad  { color: var(--danger-2); }

  .drawer-sub-h {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2);
    margin: 18px 0 10px;
    font-weight: 500;
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-sub-h .right {
    color: var(--muted-2);
    text-transform: none; letter-spacing: 0;
    font-family: 'Inter', sans-serif;
    font-size: 12px; font-weight: 450;
  }

  .cls-student-list .avatar-sm { width: 30px; height: 30px; font-size: 11px; }
  .cls-student-list .row-open { color: var(--muted-3); }

  .cls-empty { text-align: center; padding: 40px 20px; background: var(--canvas); border: 1px dashed var(--hair); border-radius: 12px; }
  .cls-empty .es-ill { width: 48px; height: 48px; border-radius: 12px; background: var(--primary-tint); color: var(--primary); display: grid; place-items: center; margin: 0 auto 12px; }
  .cls-empty .es-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .cls-empty .es-sub { font-size: 12.5px; color: var(--muted); max-width: 280px; margin: 0 auto; line-height: 1.5; }

  .drawer-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--hair-2);
    display: flex; gap: 8px; align-items: center;
    background: var(--canvas);
  }
  .drawer-foot .spacer { flex: 1; }

  .avatar { width: 32px; height: 32px; border-radius: 50%; color: #fff; font-weight: 600; font-size: 12px; display: grid; place-items: center; letter-spacing: -0.01em; flex-shrink: 0; }

  @media (max-width: 1024px) { .drawer { width: 100vw; } }
</style>
</head>
<body>
