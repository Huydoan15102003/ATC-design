<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SpeakIQ — Pronunciation Assessment</title>
<meta name="viewport" content="width=1440, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #0b1220;
    --ink-2: #1f2a3d;
    --ink-3: #2c3a52;
    --muted: #5b6577;
    --muted-2: #8892a3;
    --muted-3: #a3acba;
    --hair: #e6e9ef;
    --hair-2: #eef0f4;
    --hair-3: #f2f4f8;
    --bg: #ffffff;
    --canvas: #f7f8fb;
    --canvas-2: #f3f5f9;
    --primary: #2563eb;
    --primary-600: #1e54d4;
    --primary-700: #1a47b8;
    --primary-tint: #eef4ff;
    --primary-tint-2: #e0ebff;
    --focus-ring: rgba(37, 99, 235, 0.18);
    --success: #16a34a;
    --success-tint: #e9f7ee;
    --success-2: #15803d;
    --warn: #d97706;
    --warn-tint: #fef3e2;
    --danger: #dc2626;
    --danger-tint: #fdecec;
    --navy-1: #0f172a;
    --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.05);
    --shadow-card-2: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
    --shadow-mic: 0 14px 40px rgba(37, 99, 235, 0.28), 0 4px 10px rgba(15,23,42,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--canvas);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv11', 'ss01', 'ss03';
  }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }

  /* ─────────────── SIDEBAR (shared) ─────────────── */
  .sidebar {
    background: #ffffff;
    border-right: 1px solid var(--hair);
    display: flex; flex-direction: column;
    padding: 22px 12px 20px;
    position: sticky; top: 0; align-self: start;
    height: 100vh;
  }
  .sb-logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; margin-bottom: 6px; border-bottom: 1px solid var(--hair-2); }
  .sb-logo .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--navy-1); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: -0.01em; }
  .sb-logo .text { line-height: 1.1; }
  .sb-logo .name { font-size: 13.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.005em; }
  .sb-logo .org { font-size: 11px; color: var(--muted-2); margin-top: 2px; font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.04em; text-transform: uppercase; }

  .sb-section { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-3); padding: 18px 12px 8px; }
  .sb-nav { display: flex; flex-direction: column; gap: 2px; }
  .sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); font-size: 13.5px; font-weight: 450; cursor: default; position: relative; border-left: 3px solid transparent; padding-left: 9px; transition: background-color .15s ease, color .15s ease; }
  .sb-item:hover { background: var(--hair-3); }
  .sb-item .ico { color: var(--muted); display: grid; place-items: center; }
  .sb-item.active { background: var(--primary-tint); color: var(--primary-700); border-left-color: var(--primary); font-weight: 500; }
  .sb-item.active .ico { color: var(--primary); }
  .sb-badge { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--primary); background: #fff; border: 1px solid var(--primary-tint-2); padding: 1px 6px; border-radius: 999px; }

  .sb-foot { margin-top: auto; padding: 10px 4px 0; border-top: 1px solid var(--hair-2); }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: default; }
  .sb-user:hover { background: var(--hair-3); }
  .sb-user .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #6ea8ff); color: #fff; font-weight: 600; font-size: 12px; display: grid; place-items: center; letter-spacing: -0.01em; }
  .sb-user .meta { line-height: 1.15; flex: 1; min-width: 0; }
  .sb-user .name { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-user .role { font-size: 11px; color: var(--muted-2); margin-top: 2px; }

  /* ─────────────── MAIN ─────────────── */
  .main { display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--hair);
    height: 56px;
    display: flex; align-items: center;
    padding: 0 28px;
    gap: 14px;
  }
  .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .breadcrumb .sep { color: var(--muted-3); }
  .breadcrumb .now { color: var(--ink); font-weight: 500; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .top-btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hair); background: #fff; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; cursor: default; }
  .top-btn:hover { border-color: #d6dbe4; background: #fbfcfd; }
  .top-btn .ico { color: var(--muted); }

  /* ─────────────── TWO-PANEL ─────────────── */
  .split {
    display: grid;
    grid-template-columns: 40fr 60fr;
    min-height: calc(100vh - 56px);
  }
  .pane-l {
    background: var(--canvas-2);
    border-right: 1px solid var(--hair);
    padding: 28px 28px 28px;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .pane-r {
    background: #ffffff;
    padding: 28px 28px 28px;
    display: flex; flex-direction: column;
    min-width: 0;
    position: relative;
  }

  /* page heads */
  .pane-head { margin-bottom: 18px; }
  .pane-head .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted-2); margin-bottom: 8px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .pane-head .eyebrow::before { content: ""; width: 14px; height: 1px; background: currentColor; opacity: 0.6; }
  .pane-head h1 {
    font-size: 22px; font-weight: 600;
    letter-spacing: -0.022em; margin: 0; color: var(--ink);
  }
  .pane-head .sub { margin-top: 6px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }

  /* assign-to row */
  .assign-row {
    display: flex; align-items: center; gap: 10px;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 11px;
    padding: 10px 12px;
    margin-bottom: 18px;
  }
  .assign-row .lbl {
    font-size: 12.5px; color: var(--muted);
    padding-left: 4px;
  }
  .assign-row .picker {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: default;
    font-size: 13.5px; color: var(--ink);
  }
  .assign-row .picker:hover { background: var(--hair-3); }
  .assign-row .picker .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #6ea8ff);
    color: #fff; font-size: 11px; font-weight: 600;
    display: grid; place-items: center;
  }
  .assign-row .picker .empty {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--hair-2);
    color: var(--muted-2);
    display: grid; place-items: center;
  }
  .assign-row .picker .code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11.5px; color: var(--muted-2); letter-spacing: 0.04em;
  }
  .assign-row .chev { color: var(--muted-2); margin-left: auto; }

  /* sentence list */
  .sentences-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px;
  }
  .sentences-head .title {
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    letter-spacing: -0.005em;
  }
  .sentences-head .count {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.04em;
    color: var(--muted-2);
  }
  .sentences-head .count b { color: var(--ink-2); font-weight: 600; }

  .sentence-list {
    display: flex; flex-direction: column;
    gap: 8px;
    flex: 1;
    overflow-y: auto;
    padding-right: 2px;
    margin-right: -2px;
    scrollbar-width: thin;
  }

  .sentence-row {
    display: flex; align-items: center; gap: 10px;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 10px;
    padding: 6px 6px 6px 10px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .sentence-row:hover { border-color: #d6dbe4; }
  .sentence-row:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--focus-ring);
  }
  .sentence-row .num {
    width: 22px; height: 22px; flex: 0 0 22px;
    border-radius: 6px;
    background: var(--hair-2);
    color: var(--muted);
    font-size: 11.5px; font-weight: 600;
    display: grid; place-items: center;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .sentence-row.current .num {
    background: var(--primary); color: #fff;
  }
  .sentence-row.done .num {
    background: var(--success-tint); color: var(--success);
  }
  .sentence-row.empty .num {
    background: transparent; color: var(--muted-3);
    border: 1px dashed var(--hair);
  }
  .sentence-row .inp {
    flex: 1; border: 0; outline: none;
    font: inherit; font-size: 13.5px;
    background: transparent;
    padding: 6px 0;
    color: var(--ink);
  }
  .sentence-row .inp::placeholder { color: #a3acba; }
  .sentence-row .del {
    width: 28px; height: 28px;
    border: 0; background: transparent;
    color: var(--muted-2); border-radius: 6px;
    display: grid; place-items: center;
    cursor: default;
  }
  .sentence-row .del:hover { background: var(--hair-3); color: var(--danger); }
  .sentence-row.empty .del { opacity: 0; pointer-events: none; }

  /* add/generate row */
  .list-actions {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px;
  }
  .btn {
    appearance: none; border: 0; cursor: default;
    height: 38px;
    padding: 0 14px;
    border-radius: 9px;
    font: inherit; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease;
    letter-spacing: -0.005em;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 6px 14px rgba(37,99,235,0.22); }
  .btn-primary:hover { background: var(--primary-600); }
  .btn-primary:disabled, .btn-primary.disabled { background: #c9d3e6; box-shadow: none; cursor: not-allowed; }
  .btn-outline { background: #fff; border: 1px solid var(--hair); color: var(--ink-2); }
  .btn-outline:hover { border-color: #c5ccd9; background: #fbfcfd; }
  .btn-soft { background: var(--primary-tint); color: var(--primary); }
  .btn-soft:hover { background: var(--primary-tint-2); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--ink-2); background: var(--hair-3); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* sticky start cluster */
  .start-cluster {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--hair);
    display: flex; flex-direction: column; gap: 10px;
  }
  .start-cluster .hint {
    font-size: 12px;
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .start-cluster .btn-primary { height: 44px; font-size: 14px; }
  .start-cluster .btn-primary .ico-r { margin-left: 4px; }

  /* ─────────────── RIGHT PANEL ─────────────── */
  .live-empty {
    flex: 1;
    display: grid; place-items: center;
    text-align: center;
    padding: 60px 40px;
  }
  .live-empty .ill {
    width: 84px; height: 84px;
    border-radius: 22px;
    background: var(--primary-tint);
    color: var(--primary);
    display: grid; place-items: center;
    margin: 0 auto 22px;
  }
  .live-empty h2 {
    font-size: 19px; font-weight: 600;
    margin: 0 0 8px; color: var(--ink);
    letter-spacing: -0.012em;
  }
  .live-empty p {
    color: var(--muted); font-size: 14px;
    line-height: 1.55;
    max-width: 380px; margin: 0 auto 22px;
  }
  .live-empty .steps-mini {
    display: flex; gap: 22px; justify-content: center;
    margin-top: 14px;
  }
  .live-empty .step-mini {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .live-empty .step-mini .n {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--hair);
    color: var(--ink-2);
    font-size: 12px; font-weight: 600;
    display: grid; place-items: center;
  }

  /* progress header on right */
  .live-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
    gap: 18px;
  }
  .live-head .left { display: flex; align-items: center; gap: 12px; }
  .student-chip {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 6px 12px 6px 6px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--hair);
  }
  .student-chip .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #6ea8ff);
    color: #fff; font-size: 11px; font-weight: 600;
    display: grid; place-items: center;
  }
  .student-chip .name { font-size: 13px; font-weight: 500; color: var(--ink); }
  .student-chip .code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; color: var(--muted-2); letter-spacing: 0.04em;
    padding-left: 4px; border-left: 1px solid var(--hair-2);
    margin-left: 2px;
  }

  .session-meta {
    margin-left: auto;
    display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; color: var(--muted);
  }
  .session-meta .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--danger-tint);
    color: var(--danger);
    font-weight: 500;
    font-size: 12px;
  }
  .session-meta .pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--danger);
    animation: pulse-dot 1.4s ease-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .progress-block { width: 100%; }
  .progress-block .meta {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 8px;
  }
  .progress-block .meta .l {
    font-size: 13px; font-weight: 500; color: var(--ink-2);
  }
  .progress-block .meta .r {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.04em;
    color: var(--muted-2); text-transform: uppercase;
  }
  .progress-block .track {
    height: 6px; border-radius: 999px;
    background: var(--hair-2);
    overflow: hidden;
    display: flex; gap: 2px;
  }
  .progress-block .seg {
    flex: 1; height: 100%;
    background: var(--hair-2);
    transition: background-color .25s ease;
    border-radius: 2px;
  }
  .progress-block .seg.done { background: var(--success); }
  .progress-block .seg.cur { background: var(--primary); }

  /* live stage */
  .live-stage {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 22px 0 12px;
  }
  .sentence-card {
    width: 100%;
    max-width: 620px;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 16px;
    padding: 28px 36px 32px;
    text-align: center;
    box-shadow: var(--shadow-card-2);
    position: relative;
  }
  .sentence-card .crumb {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 14px;
  }
  .sentence-card .crumb b { color: var(--primary); font-weight: 600; }
  .sentence-card .text {
    font-size: 26px;
    line-height: 1.4;
    letter-spacing: -0.012em;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .sentence-card .ipa {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
    line-height: 1.55;
  }

  /* mic */
  .mic-stage {
    margin-top: 28px;
    display: flex; flex-direction: column; align-items: center;
    gap: 12px;
  }
  .mic {
    position: relative;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(180deg, #f4f6fa, #e6e9ef);
    color: var(--muted);
    display: grid; place-items: center;
    cursor: default;
    border: 0;
    transition: all .2s ease;
    box-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 4px 14px rgba(15,23,42,0.05);
  }
  .mic.idle {
    background: linear-gradient(180deg, #f4f6fa, #e6e9ef);
    color: var(--ink-2);
  }
  .mic.idle:hover {
    background: linear-gradient(180deg, var(--primary), var(--primary-700));
    color: #fff;
    box-shadow: var(--shadow-mic);
    transform: translateY(-1px);
  }
  .mic.recording {
    background: linear-gradient(180deg, #ef4444, #b91c1c);
    color: #fff;
    box-shadow: 0 14px 40px rgba(220,38,38,0.32), 0 4px 10px rgba(15,23,42,0.08);
  }
  .mic.recording::before,
  .mic.recording::after {
    content: ""; position: absolute; inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(220,38,38,0.5);
    animation: ring 1.6s ease-out infinite;
  }
  .mic.recording::after { animation-delay: .8s; }
  @keyframes ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  .mic-label {
    font-size: 12.5px;
    color: var(--muted);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .mic-label .rec {
    color: var(--danger); font-weight: 600;
  }

  /* recording waveform */
  .wave {
    height: 56px;
    width: 100%; max-width: 520px;
    margin: 8px auto 0;
    display: flex; align-items: center; justify-content: center;
    gap: 3px;
  }
  .wave .b {
    width: 3px; border-radius: 2px;
    background: var(--primary);
    animation: wbar 1.1s ease-in-out infinite;
    transform-origin: center;
  }
  .wave.recording .b { background: var(--danger); }
  @keyframes wbar {
    0%, 100% { height: 8px; opacity: 0.4; }
    50%      { height: 38px; opacity: 1; }
  }

  /* score card */
  .score-card {
    width: 100%; max-width: 620px;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: 18px 22px 20px;
    margin-top: 18px;
    box-shadow: var(--shadow-card);
  }
  .score-card .row1 {
    display: flex; align-items: center; gap: 18px;
  }
  .score-card .overall {
    display: flex; align-items: baseline; gap: 6px;
    line-height: 1;
  }
  .score-card .overall .n {
    font-size: 38px; font-weight: 600; letter-spacing: -0.025em;
    color: var(--success);
  }
  .score-card .overall .d {
    font-size: 16px; color: var(--muted-2);
    font-weight: 500;
  }
  .score-card .verdict {
    font-size: 13px; color: var(--muted);
    margin-top: 4px;
  }
  .score-card .verdict b { color: var(--ink-2); font-weight: 600; }
  .score-card .pills {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: var(--hair-3);
    color: var(--ink-2);
    border: 1px solid transparent;
  }
  .pill .label { color: var(--muted); font-weight: 450; }
  .pill .v { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; }
  .pill.good { background: var(--success-tint); color: var(--success-2); }
  .pill.warn { background: var(--warn-tint); color: var(--warn); }
  .pill.bad  { background: var(--danger-tint); color: var(--danger); }
  .pill.good .label, .pill.warn .label, .pill.bad .label { color: inherit; opacity: 0.7; }

  .score-card .row2 {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--hair-2);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .score-card .note {
    font-size: 12.5px; color: var(--muted);
    line-height: 1.45;
    max-width: 380px;
  }
  .score-card .note b { color: var(--ink-2); font-weight: 500; }
  .score-card .actions { display: flex; gap: 8px; }

  /* completed view */
  .complete-head {
    text-align: center;
    margin-bottom: 22px;
  }
  .complete-head .ico-tile {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: var(--success-tint);
    color: var(--success);
    display: grid; place-items: center;
    margin: 0 auto 14px;
  }
  .complete-head h2 {
    font-size: 22px; font-weight: 600;
    letter-spacing: -0.018em;
    margin: 0 0 6px;
  }
  .complete-head p {
    color: var(--muted); font-size: 14px; margin: 0;
  }

  .summary-card {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .summary-totals {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    align-items: center;
    padding: 18px 22px;
    background: linear-gradient(180deg, #f9fbff, #ffffff);
    border-bottom: 1px solid var(--hair-2);
  }
  .summary-totals .big {
    display: flex; align-items: baseline; gap: 6px;
  }
  .summary-totals .big .n {
    font-size: 38px; font-weight: 600; letter-spacing: -0.025em;
    color: var(--success);
    line-height: 1;
  }
  .summary-totals .big .d { font-size: 16px; color: var(--muted-2); font-weight: 500; }
  .summary-totals .stat .k {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 4px;
  }
  .summary-totals .stat .v {
    font-size: 18px; font-weight: 600; color: var(--ink);
    letter-spacing: -0.012em;
  }

  table.scores {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.scores th, table.scores td {
    text-align: left;
    padding: 11px 22px;
    border-bottom: 1px solid var(--hair-2);
  }
  table.scores th {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted-2);
    font-weight: 500;
    background: var(--hair-3);
  }
  table.scores tr:last-child td { border-bottom: 0; }
  table.scores td.num {
    width: 36px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: var(--muted-2);
  }
  table.scores td.sent {
    color: var(--ink-2);
    max-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  table.scores td.score b {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  table.scores td.pills { width: 1%; white-space: nowrap; }
  table.scores .pill { font-size: 11px; padding: 2px 8px; }

  /* finish row */
  .finish-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 22px;
  }

  /* legend */
  .legend {
    display: flex; gap: 12px; align-items: center;
    font-size: 11px; color: var(--muted);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.04em;
  }
  .legend .it { display: inline-flex; align-items: center; gap: 5px; }
  .legend .sw { width: 8px; height: 8px; border-radius: 50%; }
  .legend .sw.g { background: var(--success); }
  .legend .sw.a { background: var(--warn); }
  .legend .sw.r { background: var(--danger); }

  /* misc */
  .x-divider {
    border: 0; border-top: 1px solid var(--hair); margin: 16px 0;
  }
  input[type="date"]::-webkit-calendar-picker-indicator { cursor: default; opacity: 0.5; }

  @media (max-width: 1180px) {
    .split { grid-template-columns: 1fr; }
    .pane-l { border-right: 0; border-bottom: 1px solid var(--hair); }
  }
</style>
</head>
