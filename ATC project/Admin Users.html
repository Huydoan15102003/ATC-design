<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SpeakIQ — User Management</title>
<meta name="viewport" content="width=1440, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #0b1220;
    --ink-2: #1f2a3d;
    --ink-3: #2c3a52;
    --muted: #5b6577;
    --muted-2: #8892a3;
    --muted-3: #a3acba;
    --hair: #e6e9ef;
    --hair-2: #eef0f4;
    --hair-3: #f2f4f8;
    --bg: #ffffff;
    --canvas: #f7f8fb;
    --canvas-2: #f3f5f9;
    --primary: #2563eb;
    --primary-600: #1e54d4;
    --primary-700: #1a47b8;
    --primary-tint: #eef4ff;
    --primary-tint-2: #e0ebff;
    --focus-ring: rgba(37, 99, 235, 0.18);
    --success: #16a34a;
    --success-2: #15803d;
    --success-tint: #e9f7ee;
    --success-tint-2: #d4ecdd;
    --warn: #d97706;
    --warn-2: #b45309;
    --warn-tint: #fef3e2;
    --warn-tint-2: #fce7c4;
    --danger: #dc2626;
    --danger-2: #b91c1c;
    --danger-tint: #fdecec;
    --danger-tint-2: #f8d4d4;
    --navy-1: #0f172a;
    --shadow-card:   0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.05);
    --shadow-card-2: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
    --shadow-drawer: -20px 0 60px rgba(15, 23, 42, 0.12), -2px 0 8px rgba(15, 23, 42, 0.06);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--canvas);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv11', 'ss01', 'ss03';
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }

  /* ─────────────── SIDEBAR ─────────────── */
  .sidebar {
    background: #ffffff;
    border-right: 1px solid var(--hair);
    display: flex; flex-direction: column;
    padding: 22px 12px 20px;
    position: sticky; top: 0; align-self: start;
    height: 100vh;
  }
  .sb-logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; margin-bottom: 6px; border-bottom: 1px solid var(--hair-2); }
  .sb-logo .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--navy-1); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: -0.01em; }
  .sb-logo .text { line-height: 1.1; }
  .sb-logo .name { font-size: 13.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.005em; }
  .sb-logo .org  { font-size: 11px; color: var(--muted-2); margin-top: 2px; font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.04em; text-transform: uppercase; }

  .sb-section { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-3); padding: 18px 12px 8px; }
  .sb-nav { display: flex; flex-direction: column; gap: 2px; }
  .sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); font-size: 13.5px; font-weight: 450; cursor: default; position: relative; border-left: 3px solid transparent; padding-left: 9px; transition: background-color .15s ease, color .15s ease; }
  .sb-item:hover { background: var(--hair-3); }
  .sb-item .ico { color: var(--muted); display: grid; place-items: center; }
  .sb-item.active { background: var(--primary-tint); color: var(--primary-700); border-left-color: var(--primary); font-weight: 500; }
  .sb-item.active .ico { color: var(--primary); }
  .sb-badge { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--primary); background: #fff; border: 1px solid var(--primary-tint-2); padding: 1px 6px; border-radius: 999px; }
  .sb-count { margin-left: auto; font-size: 11px; font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--muted-2); font-weight: 500; }

  .sb-foot { margin-top: auto; padding: 10px 4px 0; border-top: 1px solid var(--hair-2); }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: default; }
  .sb-user:hover { background: var(--hair-3); }
  .sb-user .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #0f172a, #334155); color: #fff; font-weight: 600; font-size: 12px; display: grid; place-items: center; letter-spacing: -0.01em; }
  .sb-user .meta { line-height: 1.15; flex: 1; min-width: 0; }
  .sb-user .name { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-user .role { font-size: 11px; color: var(--muted-2); margin-top: 2px; }

  /* ─────────────── TOP BAR ─────────────── */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--hair);
    height: 56px;
    display: flex; align-items: center;
    padding: 0 32px;
    gap: 14px;
    position: sticky; top: 0; z-index: 5;
  }
  .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .breadcrumb .sep { color: var(--muted-3); }
  .breadcrumb .now { color: var(--ink); font-weight: 500; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .top-btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hair); background: #fff; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; cursor: default; }
  .top-btn:hover { border-color: #d6dbe4; background: #fbfcfd; }
  .top-btn .ico { color: var(--muted); }

  /* ─────────────── PAGE ─────────────── */
  .page {
    padding: 32px 36px 80px;
    max-width: 1280px;
    margin: 0 auto;
    width: 100%;
  }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--hair); margin-bottom: 0; }
  .page-head .ph-left { min-width: 0; }
  .page-head .ph-eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 8px; display: inline-flex; align-items: center; gap: 8px; }
  .page-head .ph-eyebrow::before { content: ""; width: 14px; height: 1px; background: currentColor; opacity: 0.55; }
  .page-head h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 8px; color: var(--ink); }
  .page-head .ph-meta { color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 0; flex-wrap: wrap; line-height: 1.5; }
  .page-head .ph-meta .dot { color: var(--muted-3); margin: 0 9px; }
  .page-head .ph-meta b { color: var(--ink-2); font-weight: 500; }

  .btn {
    appearance: none; border: 0; cursor: default;
    height: 38px;
    padding: 0 14px;
    border-radius: 9px;
    font: inherit; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease;
    letter-spacing: -0.005em;
    white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 6px 14px rgba(37,99,235,0.22); }
  .btn-primary:hover { background: var(--primary-600); }
  .btn-outline { background: #fff; border: 1px solid var(--hair); color: var(--ink-2); }
  .btn-outline:hover { border-color: #c5ccd9; background: #fbfcfd; }
  .btn-soft { background: var(--primary-tint); color: var(--primary); }
  .btn-soft:hover { background: var(--primary-tint-2); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--ink-2); background: var(--hair-3); }
  .btn-danger-ghost { background: transparent; color: var(--danger); }
  .btn-danger-ghost:hover { background: var(--danger-tint); }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }

  /* ─────────────── TABS ─────────────── */
  .tabs-strip {
    display: flex;
    align-items: stretch;
    gap: 2px;
    border-bottom: 1px solid var(--hair);
    margin-top: 18px;
    margin-bottom: 22px;
    position: sticky;
    top: 56px;
    background: var(--canvas);
    z-index: 4;
  }
  .tab {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 14px; font-weight: 500;
    color: var(--muted);
    padding: 14px 4px 13px;
    margin-right: 22px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: default;
    display: inline-flex; align-items: center; gap: 9px;
    letter-spacing: -0.008em;
    transition: color .15s ease, border-color .15s ease;
    position: relative;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.on { color: var(--ink); border-bottom-color: var(--primary); }
  .tab .ico { color: var(--muted); display: grid; place-items: center; }
  .tab.on .ico { color: var(--primary); }
  .tab .count {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--muted-2);
    background: var(--hair-3);
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 500;
  }
  .tab.on .count { background: var(--primary-tint); color: var(--primary-700); }

  /* ─────────────── TOOLBAR (search + filters + action) ─────────────── */
  .toolbar {
    display: flex; align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 360px;
  }
  .search-wrap .ico {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--muted-2);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    height: 36px;
    padding: 0 12px 0 36px;
    border-radius: 9px;
    border: 1px solid var(--hair);
    background: #fff;
    font: inherit; font-size: 13.5px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--focus-ring); }
  .search-wrap input::placeholder { color: var(--muted-2); }

  .filter-chip {
    appearance: none; border: 1px solid var(--hair); background: #fff;
    height: 36px; padding: 0 12px;
    border-radius: 9px;
    color: var(--ink-2);
    font: inherit; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px;
    cursor: default;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .filter-chip:hover { background: #fbfcfd; border-color: #c5ccd9; }
  .filter-chip .ico { color: var(--muted); }
  .filter-chip .chev { color: var(--muted-2); }
  .filter-chip .val { color: var(--muted); font-weight: 450; }
  .filter-chip.active { background: var(--primary-tint); border-color: var(--primary-tint-2); color: var(--primary-700); }
  .filter-chip.active .ico { color: var(--primary); }

  .toolbar .spacer { flex: 1; }

  /* ─────────────── TABLE ─────────────── */
  .data-card {
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 12px;
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  table.data {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.data thead th {
    text-align: left;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted-2);
    font-weight: 500;
    padding: 12px 14px;
    border-bottom: 1px solid var(--hair);
    background: var(--canvas);
    user-select: none;
    white-space: nowrap;
  }
  table.data thead th .sort-arr { display: inline-block; margin-left: 4px; color: var(--muted-3); }
  table.data tbody td {
    padding: 14px;
    border-bottom: 1px solid var(--hair-2);
    font-size: 13.5px;
    color: var(--ink-2);
    vertical-align: middle;
  }
  table.data tbody tr:last-child td { border-bottom: 0; }
  table.data tbody tr { transition: background-color .12s ease; cursor: default; }
  table.data tbody tr:hover { background: var(--hair-3); }
  table.data tbody tr.selected { background: var(--primary-tint); }
  table.data tbody tr.selected:hover { background: var(--primary-tint-2); }

  /* col widths — teachers */
  table.data.teachers col.c-name   { width: 24%; }
  table.data.teachers col.c-email  { width: 22%; }
  table.data.teachers col.c-stu    { width: 11%; }
  table.data.teachers col.c-sess   { width: 13%; }
  table.data.teachers col.c-score  { width: 12%; }
  table.data.teachers col.c-status { width: 10%; }
  table.data.teachers col.c-actions{ width: 8%;  }

  /* col widths — students */
  table.data.students col.c-name   { width: 21%; }
  table.data.students col.c-email  { width: 20%; }
  table.data.students col.c-teach  { width: 15%; }
  table.data.students col.c-level  { width: 11%; }
  table.data.students col.c-score  { width: 14%; }
  table.data.students col.c-active { width: 11%; }
  table.data.students col.c-status { width: 8%;  }

  /* name cell */
  .ucell { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    color: #fff; font-weight: 600; font-size: 12px;
    display: grid; place-items: center;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }
  .avatar.lg { width: 56px; height: 56px; font-size: 18px; letter-spacing: -0.02em; }
  .ucell .meta { min-width: 0; line-height: 1.2; }
  .ucell .name { font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ucell .sub  { font-size: 11.5px; color: var(--muted-2); margin-top: 2px; font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.04em; }

  .email-cell { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num-cell { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--ink-2); }
  .num-cell .delta { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: var(--muted-2); margin-left: 6px; }
  .num-cell .delta.up { color: var(--success-2); }
  .num-cell .delta.down { color: var(--danger); }

  /* score pill */
  .score-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px 4px 9px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; font-weight: 600;
    letter-spacing: -0.005em;
    font-variant-numeric: tabular-nums;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .score-pill .d { font-weight: 450; opacity: 0.7; font-size: 10.5px; margin-left: -2px; }
  .score-pill.good { background: var(--success-tint); color: var(--success-2); border-color: var(--success-tint-2); }
  .score-pill.warn { background: var(--warn-tint);    color: var(--warn-2);    border-color: var(--warn-tint-2); }
  .score-pill.bad  { background: var(--danger-tint);  color: var(--danger-2);  border-color: var(--danger-tint-2); }

  /* score + mini bar for students table */
  .score-stack { display: flex; flex-direction: column; gap: 5px; max-width: 130px; }
  .score-stack .mini-bar {
    height: 4px;
    border-radius: 999px;
    background: var(--hair-2);
    overflow: hidden;
  }
  .score-stack .mini-bar .fill {
    height: 100%;
    border-radius: inherit;
    transition: width .4s ease;
  }
  .score-stack .mini-bar .fill.good { background: var(--success); }
  .score-stack .mini-bar .fill.warn { background: var(--warn); }
  .score-stack .mini-bar .fill.bad  { background: var(--danger); }

  /* level pill */
  .level-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px; font-weight: 500;
    letter-spacing: -0.005em;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .level-pill::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .level-pill.beginner     { background: var(--warn-tint);    color: var(--warn-2);    border-color: var(--warn-tint-2); }
  .level-pill.intermediate { background: var(--primary-tint); color: var(--primary-700); border-color: var(--primary-tint-2); }
  .level-pill.advanced     { background: var(--success-tint); color: var(--success-2); border-color: var(--success-tint-2); }

  /* status pill */
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px; font-weight: 500;
    letter-spacing: -0.005em;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .status-pill::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-pill.active   { background: var(--success-tint); color: var(--success-2); border-color: var(--success-tint-2); }
  .status-pill.inactive { background: var(--hair-3);       color: var(--muted);     border-color: var(--hair); }

  /* row actions */
  .row-actions {
    position: relative;
    display: flex; justify-content: flex-end;
  }
  .icon-btn {
    appearance: none; border: 0; background: transparent;
    width: 30px; height: 30px;
    border-radius: 7px;
    color: var(--muted);
    display: grid; place-items: center;
    cursor: default;
    transition: background-color .12s ease, color .12s ease;
  }
  .icon-btn:hover { background: var(--hair-2); color: var(--ink-2); }
  .icon-btn.on { background: var(--hair-2); color: var(--ink); }

  .menu {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    min-width: 184px;
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 10px;
    box-shadow: var(--shadow-card-2);
    padding: 5px;
    z-index: 20;
    animation: menuIn .12s ease-out;
  }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .menu-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    background: transparent;
    border: 0; appearance: none;
    font: inherit; font-size: 13px;
    color: var(--ink-2);
    text-align: left;
    cursor: default;
  }
  .menu-item:hover { background: var(--hair-3); }
  .menu-item .ico { color: var(--muted); }
  .menu-item.danger { color: var(--danger); }
  .menu-item.danger:hover { background: var(--danger-tint); }
  .menu-item.danger .ico { color: var(--danger); }
  .menu-sep { height: 1px; background: var(--hair-2); margin: 4px 0; }

  /* table footer */
  .data-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-top: 1px solid var(--hair);
    background: var(--canvas);
    font-size: 12.5px;
    color: var(--muted);
  }
  .data-foot .count-info b { color: var(--ink-2); font-weight: 600; }
  .pager { display: flex; align-items: center; gap: 6px; }
  .pager .pg-btn {
    appearance: none; border: 1px solid var(--hair); background: #fff;
    height: 28px; min-width: 28px; padding: 0 8px;
    border-radius: 7px;
    color: var(--ink-2);
    font: inherit; font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: default;
  }
  .pager .pg-btn:hover { background: #fbfcfd; }
  .pager .pg-btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pager .pg-btn[disabled] { opacity: 0.45; }

  /* ─────────────── DRAWER ─────────────── */
  .drawer-scrim {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.18);
    z-index: 40;
    animation: fadeIn .18s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .drawer {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 360px;
    background: #fff;
    border-left: 1px solid var(--hair);
    box-shadow: var(--shadow-drawer);
    z-index: 41;
    display: flex; flex-direction: column;
    animation: drawerIn .25s cubic-bezier(.2,.85,.3,1);
  }
  @keyframes drawerIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .drawer-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--hair-2);
    gap: 12px;
  }
  .drawer-head .left { display: flex; gap: 14px; min-width: 0; flex: 1; }
  .drawer-head .meta { min-width: 0; flex: 1; }
  .drawer-head .meta .name {
    font-size: 17px; font-weight: 600; color: var(--ink);
    letter-spacing: -0.012em;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .drawer-head .meta .sub {
    font-size: 12px;
    color: var(--muted-2);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .drawer-head .meta .pills { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }

  .drawer-close {
    appearance: none; border: 0; background: var(--hair-3);
    width: 30px; height: 30px;
    border-radius: 8px;
    color: var(--muted);
    display: grid; place-items: center;
    cursor: default;
    flex-shrink: 0;
  }
  .drawer-close:hover { background: var(--hair-2); color: var(--ink-2); }

  .drawer-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--hair-2);
    padding: 0 18px;
  }
  .drawer-tab {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 13px; font-weight: 500;
    color: var(--muted);
    padding: 11px 4px 10px;
    margin-right: 18px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: default;
    transition: color .15s ease, border-color .15s ease;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .drawer-tab:hover { color: var(--ink-2); }
  .drawer-tab.on { color: var(--ink); border-bottom-color: var(--primary); }
  .drawer-tab .count {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--muted-2);
    background: var(--hair-3);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .drawer-tab.on .count { background: var(--primary-tint); color: var(--primary-700); }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
  }

  .field-group { display: flex; flex-direction: column; gap: 14px; }
  .field {
    display: flex; flex-direction: column; gap: 5px;
  }
  .field label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2);
    font-weight: 500;
  }
  .field .v {
    font-size: 13.5px;
    color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .field input.text-in, .field select.select-in {
    appearance: none;
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--hair);
    background: #fff;
    font: inherit; font-size: 13.5px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input.text-in:focus, .field select.select-in:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--focus-ring);
  }
  .field select.select-in {
    padding-right: 30px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238892a3' d='M0 0h10L5 6z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 6px;
  }
  .stat-tile {
    background: var(--canvas);
    border: 1px solid var(--hair-2);
    border-radius: 10px;
    padding: 12px 12px 11px;
  }
  .stat-tile .lbl {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 4px;
  }
  .stat-tile .val {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 20px; font-weight: 600; letter-spacing: -0.012em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .stat-tile .val.good { color: var(--success-2); }
  .stat-tile .val.warn { color: var(--warn-2); }
  .stat-tile .val.bad  { color: var(--danger-2); }
  .stat-tile .delta {
    font-size: 11px;
    color: var(--muted-2);
    margin-top: 2px;
  }
  .stat-tile .delta.up { color: var(--success-2); }
  .stat-tile .delta.down { color: var(--danger); }

  .drawer-sub-h {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted-2);
    margin: 18px 0 8px;
    font-weight: 500;
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-sub-h:first-child { margin-top: 0; }
  .drawer-sub-h .right {
    color: var(--primary);
    text-transform: none;
    letter-spacing: 0;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    cursor: default;
  }
  .drawer-sub-h .right:hover { text-decoration: underline; }

  .session-list { display: flex; flex-direction: column; gap: 6px; }
  .session-item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--hair-2);
    border-radius: 9px;
    background: #fff;
    cursor: default;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .session-item:hover { border-color: var(--hair); background: var(--hair-3); }
  .session-item .title {
    font-size: 13px;
    color: var(--ink-2);
    font-weight: 500;
    line-height: 1.25;
  }
  .session-item .when {
    font-size: 11px;
    color: var(--muted-2);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.04em;
    margin-top: 2px;
  }
  .session-item .chev { color: var(--muted-3); }

  .mini-list { display: flex; flex-direction: column; gap: 4px; }
  .mini-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: default;
  }
  .mini-row:hover { background: var(--hair-3); }
  .mini-row .avatar { width: 26px; height: 26px; font-size: 10.5px; }
  .mini-row .name { font-size: 13px; color: var(--ink-2); flex: 1; min-width: 0; }
  .mini-row .score { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .mini-row .score.good { color: var(--success-2); }
  .mini-row .score.warn { color: var(--warn-2); }
  .mini-row .score.bad  { color: var(--danger-2); }

  .drawer-foot {
    padding: 14px 18px;
    border-top: 1px solid var(--hair-2);
    display: flex; gap: 8px; align-items: center;
    background: var(--canvas);
  }
  .drawer-foot .spacer { flex: 1; }

  /* selectable row affordance */
  table.data tbody tr.clickable { cursor: default; }

  @media (max-width: 1024px) {
    .drawer { width: 100vw; }
  }
</style>
</head>
